                    </div>
                </div>

                <div class="card reveal">
                    <div class="card-title" style="margin-bottom: 12px;">📢 التوجيهات والرسائل الأسبوعية</div>
                    ${isAdmin() ? `
                        <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px;">
                            <textarea id="new-msg-input" class="input-field" rows="4" style="margin: 0; resize: vertical; min-height: 100px;" placeholder="اكتب التوجيه أو الرسالة لهذا الأسبوع..."></textarea>
                            <div class="uploader">
                                <input type="file" id="new-msg-files" accept="image/*" multiple hidden onchange="addPendingImages(this.files); this.value='';">
                                <button class="upload-btn" onclick="document.getElementById('new-msg-files').click()">📷 إضافة صور</button>
                                <div class="previews" id="msg-previews"></div>
                                <button class="btn btn-success" id="publish-msg-btn" style="width: 120px; margin-right: auto;" onclick="addWeeklyMessage()">نشر</button>
                            </div>
                        </div>
                    ` : ''}
                    <div id="messages-container">${skeleton(2)}</div>
                </div>
            `;
            renderPreviews();
            fetchWeeklyMessages();
        }

        function openSubject(id, tab = 'files') {
            currentSubjectId = id;
            currentTab = 'subject_details';
            activeSubTab = tab;

            const info = window.latestUpdates && window.latestUpdates[id];
            if (info && info.max_id) localStorage.setItem(`max_id_${id}`, info.max_id);
            // تسجيل خطوة جديدة ليتمكن الطالب من الرجوع منها
            history.pushState({ page: 'subject', id: id }, '', '#subject-' + id);
            render();
        }

        function renderSubjectDetails(app) {
            const sub = SUBJECTS.find(s => s.id === currentSubjectId) || { name: '', icon: '📘', color: '#4f8cff' };
            app.innerHTML = `
                <button class="back-btn" onclick="switchMainTab('subjects')">→ العودة للمواد</button>
                <div class="subject-head" style="--accent-soft: ${sub.color}26; --accent-glow: ${sub.color}66;">
                    <div class="subject-icon">${sub.icon}</div>
                    <div>
                        <h1>${esc(sub.name)}</h1>
                        <p>الملفات والملخصات والشروحات وصور السبورة والأسئلة</p>
                    </div>
                </div>
                <div class="card">
                    <div class="sub-tabs">
                        <span class="tab-indicator"></span>
                        <button class="sub-tab-btn ${activeSubTab === 'files' ? 'active' : ''}" onclick="switchSubTab('files')"><span class="st-ico">📖</span><span>الملفات</span></button>
                        <button class="sub-tab-btn ${activeSubTab === 'summaries' ? 'active' : ''}" onclick="switchSubTab('summaries')"><span class="st-ico">📝</span><span>الملخصات</span></button>
                        <button class="sub-tab-btn ${activeSubTab === 'videos' ? 'active' : ''}" onclick="switchSubTab('videos')"><span class="st-ico">▶️</span><span>الشروحات</span></button>
                        <button class="sub-tab-btn ${activeSubTab === 'board' ? 'active' : ''}" onclick="switchSubTab('board')"><span class="st-ico">🖼️</span><span>السبورة</span></button>
                        <button class="sub-tab-btn ${activeSubTab === 'qa' ? 'active' : ''}" onclick="switchSubTab('qa')"><span class="st-ico">💬</span><span>الأسئلة</span></button>
                    </div>
                    <div id="sub-view-container"></div>
                </div>
            `;
            requestAnimationFrame(() => slideIndicator(app.querySelector('.tab-indicator'), app.querySelector('.sub-tab-btn.active'), 'tabs'));
            if (activeSubTab === 'qa') fetchQA();
            else if (activeSubTab === 'board') fetchBoard();
            else fetchMedia(KIND_OF_TAB[activeSubTab] ? activeSubTab : 'files');
        }

        // تبديل التبويب داخل المادة بدون إعادة رسم الصفحة كلها (كي ينزلق المؤشر بسلاسة)
        function switchSubTab(tab) {
            activeSubTab = tab;
            const tabs = document.querySelectorAll('.sub-tab-btn');
            if (currentTab !== 'subject_details' || !tabs.length) return render();
            const order = ['files', 'summaries', 'videos', 'board', 'qa'];
            tabs.forEach((b, i) => b.classList.toggle('active', order[i] === tab));
            slideIndicator(document.querySelector('.tab-indicator'), document.querySelector('.sub-tab-btn.active'), 'tabs');
            const box = document.getElementById('sub-view-container');
            box.classList.remove('page-in'); void box.offsetWidth; box.classList.add('page-in');
            if (tab === 'qa') fetchQA(); else if (tab === 'board') fetchBoard(); else fetchMedia(tab);
        }

        // ---------- الملفات والملخصات والشروحات ----------
        // كل نوع يُميَّز ببادئة في عنوانه داخل قاعدة البيانات
        const PREFIX_RE = /^\[(VIDEO|PDF|SUMMARY)\]/;
        const KIND_PREFIX = { pdf: '[PDF]', video: '[VIDEO]', summary: '[SUMMARY]' };
        const TAB_OF = { pdf: 'files', video: 'videos', summary: 'summaries' };
        const KIND_OF_TAB = { files: 'pdf', videos: 'video', summaries: 'summary' };
        const KIND_UI = {
            pdf:     { icon: '📚', count: 'ملف دراسي', add: 'إضافة ملف', btn: 'btn-add-file', empty: '📂 لا توجد ملفات دراسية حتى الآن.',
                       search: 'ابحث في الملفات...', open: '📖 فتح', modal: '📖 إضافة ملف دراسي', color: 'var(--primary)', fresh: 'ملف جديد' },
            summary: { icon: '📝', count: 'ملخص', add: 'إضافة ملخص', btn: 'btn-add-summary', empty: '📝 لا توجد ملخصات حتى الآن.',
                       search: 'ابحث في الملخصات...', open: '📖 فتح', modal: '📝 إضافة ملخص', color: '#10b981', fresh: 'ملخص جديد' },
            video:   { icon: '🎬', count: 'شرح فيديو', add: 'إضافة فيديو', btn: 'btn-add-video', empty: '🎬 لا توجد شروحات فيديو حتى الآن.',
                       search: 'ابحث في الشروحات...', open: '▶️ مشاهدة', modal: '▶️ إضافة شرح فيديو', color: 'var(--danger)', fresh: 'شرح جديد' },
        };
        const lecKind = title => {
            const t = String(title || '');
            return t.startsWith('[VIDEO]') ? 'video' : t.startsWith('[SUMMARY]') ? 'summary' : 'pdf';
        };

        window.lectureMap = {};

        function linkKind(url, isVideo) {
            const u = String(url || '').toLowerCase();
            if (/youtube\.com|youtu\.be/.test(u)) return { icon: '▶️', label: 'يوتيوب', color: '#ef4444' };
            if (/drive\.google|docs\.google/.test(u)) return { icon: '📁', label: 'Google Drive', color: '#22c55e' };
            if (/t\.me|telegram/.test(u)) return { icon: '✈️', label: 'تلغرام', color: '#0ea5e9' };
            if (/\.pdf(\?|#|$)/.test(u)) return { icon: '📕', label: 'ملف PDF', color: '#3b82f6' };
            if (/\.(pptx?|docx?|xlsx?)(\?|#|$)/.test(u)) return { icon: '📝', label: 'مستند', color: '#8b5cf6' };
            return isVideo
                ? { icon: '🎬', label: 'فيديو', color: '#ef4444' }
                : { icon: '📄', label: 'ملف', color: '#3b82f6' };
        }

        function fmtTime(iso) {
            try { return new Date(iso).toLocaleString('ar-IQ', { dateStyle: 'short', timeStyle: 'short' }); }
            catch (e) { return ''; }
        }

        function fetchMedia(mediaType) {
            const container = document.getElementById('sub-view-container');
            container.innerHTML = skeleton(3);
            const kind = KIND_OF_TAB[mediaType] || 'pdf', ui = KIND_UI[kind];
            const isVid = kind === 'video';

            const forSubject = currentSubjectId;
            api(`/api/lectures/${encodeURIComponent(currentSubjectId)}`)
            .then(data => {
                // تجاهل الرد إذا انتقل الطالب لتبويب أو مادة أخرى قبل وصوله
                if (activeSubTab !== mediaType || currentSubjectId !== forSubject || !document.body.contains(container)) return;
                const list = (data || []).filter(item => lecKind(item.title) === kind);
                list.forEach(item => { window.lectureMap[item.id] = item; });

                const toolbar = isAdmin() ? `
                    <div class="toolbar">
                        <div class="toolbar-info">${ui.icon} ${list.length} ${ui.count}</div>
                        <button class="btn-add ${ui.btn}" onclick="openAddModal('${kind}')">➕ ${ui.add}</button>
                    </div>` : '';

                const listBody = list.length === 0
                    ? `<div class="empty-state">${ui.empty}</div>`
                    : `<div id="sortable-list">${list.map(item => createItemHTML(item, isVid)).join('')}</div>
                       <div class="empty-state no-results" id="no-results">🔍 لا توجد نتائج مطابقة.</div>`;

                const search = list.length > 3 ? `
                    <div class="search-box">
                        <input type="search" class="input-field" placeholder="${ui.search}" oninput="filterMedia(this.value)">
                    </div>` : '';

                container.innerHTML = toolbar + search + listBody;

                if (isAdmin() && list.length > 0 && window.Sortable) {
                    new Sortable(document.getElementById('sortable-list'), {
                        handle: '.drag-handle',
                        animation: 150,
                        ghostClass: 'sortable-ghost',
                        onEnd: function () {
                            const items = document.querySelectorAll('#sortable-list .media-item');
                            const order = Array.from(items).map((el, idx) => ({ id: Number(el.dataset.id), display_order: idx }));
                            api('/api/lectures/reorder', 'PUT', { order: order })
                            .catch(() => alert('تعذر حفظ الترتيب الجديد'));
                        }
                    });
                }
            })
            .catch(err => {
                container.innerHTML = `
                    ${isAdmin() ? `
                    <div class="toolbar">
                        <div class="toolbar-info">${ui.icon} تعذر تحميل القائمة</div>
                        <button class="btn-add ${ui.btn}" onclick="openAddModal('${kind}')">➕ ${ui.add}</button>
                    </div>` : ''}
                    <div class="empty-state" style="color: red;">❌ فشل الاتصال بالخادم (${esc(err.message)}).</div>`;
            });
        }

        function filterMedia(q) {
            const needle = normAr(q.trim());
            let shown = 0;
            document.querySelectorAll('#sortable-list .media-item').forEach(el => {
                const match = !needle || el.dataset.search.includes(needle);
                el.style.display = match ? '' : 'none';
                if (match) shown++;
            });
            const nr = document.getElementById('no-results');
            if (nr) nr.style.display = shown ? 'none' : 'block';
        }

        function createItemHTML(item, isVid) {
            const kind = linkKind(item.file_url, isVid);
            const rawTitle = item.title.replace(PREFIX_RE, '');
            const title = esc(rawTitle);
            const id = Number(item.id);
            const yt = youtubeId(item.file_url);
            const icon = yt
                ? `<img class="media-thumb" src="https://i.ytimg.com/vi/${yt}/mqdefault.jpg" alt="" loading="lazy">`
                : `<div class="media-icon" style="background: ${kind.color}22; color: ${kind.color};">${kind.icon}</div>`;
            return `
                <div class="media-item reveal" data-id="${id}" data-search="${esc(normAr(rawTitle))}">
                    ${isAdmin() ? `<div class="drag-handle" title="اسحب لتغيير الترتيب">↕️</div>` : ''}
                    ${icon}
                    <div class="media-info">
                        <div class="media-title">${title}</div>
                        <div class="media-meta">${lecKind(item.title) === 'summary' ? '📝 ملخص • ' : ''}${kind.label}</div>
                    </div>
                    <div class="media-actions">
                        <a class="act-open" style="background: ${kind.color};" href="${esc(safeUrl(item.file_url))}" target="_blank" rel="noopener noreferrer">
                            ${isVid ? '▶️ مشاهدة' : '📖 فتح'}
                        </a>
                        <button class="act-icon" title="مشاركة" onclick="shareLecture(${id})">📤</button>
                        <button class="act-icon" title="نسخ الرابط" onclick="copyLink(${id})">📋</button>
                        ${isAdmin() ? `
                            <button class="act-icon" title="تعديل العنوان" onclick="editLecture(${id})">✏️</button>
                            <button class="btn-delete" title="حذف" onclick="deleteLecture(${id})">🗑️</button>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        // =========================================================
        // المشاركة
        // =========================================================
        const SITE = location.origin;

        // على الجوال: قائمة المشاركة الخاصة بالهاتف (تلغرام، واتساب، إنستغرام...)
        // وإن لم تتوفر: نافذة مشاركة خاصة بالموقع
        function shareContent({ title, text, url }) {
            if (navigator.share) {
                navigator.share({ title, text, url }).catch(err => {
                    if (!err || err.name !== 'AbortError') openShareSheet({ title, text, url });
                });
                return;
            }
            openShareSheet({ title, text, url });
        }

        function openShareSheet({ title, text, url }) {
            const e = encodeURIComponent;
            const body = text ? `${text}\n${url}` : url;
            const opts = [
                { name: 'تلغرام', icon: '✈️', c: '#229ED9', href: `https://t.me/share/url?url=${e(url)}&text=${e(text || title)}` },
                { name: 'واتساب', icon: '💬', c: '#25D366', href: `https://wa.me/?text=${e(body)}` },
                { name: 'فيسبوك', icon: 'f', c: '#1877F2', href: `https://www.facebook.com/sharer/sharer.php?u=${e(url)}` },
                { name: 'إكس', icon: '𝕏', c: '#111827', href: `https://twitter.com/intent/tweet?text=${e(text || title)}&url=${e(url)}` },
                { name: 'البريد', icon: '✉️', c: '#ea580c', href: `mailto:?subject=${e(title)}&body=${e(body)}` },
            ];
            document.getElementById('share-preview').textContent = body;
            document.getElementById('share-url').value = url;
            document.getElementById('share-grid').innerHTML = opts.map((o, i) => `
                <a class="share-opt" style="--c: ${o.c}; animation-delay: ${i * 40}ms;" href="${esc(o.href)}" target="_blank" rel="noopener noreferrer" onclick="setTimeout(closeShare, 300)">
                    <span class="share-ico" style="font-weight: 700; font-size: 20px;">${o.icon}</span>${o.name}
                </a>`).join('') + `
                <button class="share-opt" style="--c: #4f8cff; animation-delay: ${opts.length * 40}ms;" onclick="copyText(${esc(JSON.stringify(body))}, 'تم نسخ النص والرابط'); closeShare();">
                    <span class="share-ico" style="font-size: 20px;">📋</span>نسخ الكل
                </button>`;
            document.getElementById('shareModal').style.display = 'flex';
        }

        function closeShare() { const m = document.getElementById('shareModal'); if (m) m.style.display = 'none'; }

        // =========================================================
        // استقبال المشاركة: فيديو من يوتيوب (أو أي رابط) يُشارك إلى التطبيق
        // =========================================================
        // نلتقط ما شاركه الطالب قبل أي شيء آخر، ونحفظه حتى بعد تسجيل الدخول
        (function captureIncomingShare() {
            if (location.pathname !== '/share') return;
            const p = new URLSearchParams(location.search);
            const data = { title: p.get('title') || '', text: p.get('text') || '', url: p.get('url') || '' };
            try { sessionStorage.setItem('pendingShare', JSON.stringify(data)); } catch (e) { window._pendingShare = data; }
            history.replaceState(null, '', '/');
        })();

        function processPendingShare() {
            let data = window._pendingShare || null;
            try { const s = sessionStorage.getItem('pendingShare'); if (s) data = JSON.parse(s); sessionStorage.removeItem('pendingShare'); } catch (e) {}
            window._pendingShare = null;
            if (data) setTimeout(() => openShareIn(data), 350);
        }

        let shareIn = null;

        function openShareIn({ title, text, url }) {
            // يوتيوب يضع الرابط غالباً داخل النص وليس في حقل الرابط
            const all = [url, text, title].join(' ');
            const found = (all.match(/https?:\/\/[^\s"'<>]+/) || [''])[0];
            if (!found) return showToast('لم يتم العثور على رابط في ما شاركته', '⚠️');

            // استخراج العنوان: 'Watch "العنوان" on YouTube' أو نص عادي
            let guess = (String(title).match(/["“«](.+?)["”»]/) || [])[1] || '';
            if (!guess) guess = [title, text].map(s => String(s || '').replace(found, '').trim()).find(s => s && !/^https?:/i.test(s)) || '';
            guess = guess.replace(/\s+/g, ' ').slice(0, 200);

            const yt = youtubeId(found);
            shareIn = {
                url: found,
                subject: currentTab === 'subject_details' ? currentSubjectId : null,
                type: yt ? 'video' : 'pdf',
            };

            document.getElementById('sharein-preview').innerHTML = `
                ${yt ? `<img src="https://i.ytimg.com/vi/${yt}/mqdefault.jpg" alt="">` : `<div class="ico">🔗</div>`}
                <div style="min-width: 0;"><div style="font-weight: 700; font-size: 14px;">${yt ? '▶️ فيديو يوتيوب' : '🔗 رابط'}</div>
                <div class="url">${esc(found)}</div></div>`;
            const titleInput = document.getElementById('sharein-title');
            titleInput.value = guess;
            if (!guess && yt) fetchLinkTitle(found).then(t => { if (t && !titleInput.value) titleInput.value = t; });

            const admin = isAdmin();
            document.getElementById('sharein-heading').textContent = admin ? '📥 إضافة إلى المنصة' : '📥 شارك مع الدفعة';
            document.getElementById('sharein-admin').style.display = admin ? 'block' : 'none';
            document.getElementById('sharein-student').style.display = admin ? 'none' : 'block';
            document.getElementById('sharein-note').value = '';
            document.getElementById('sharein-btn').textContent = admin ? '➕ إضافة للمادة وإرسال إشعار' : '💬 نشر في نقاش المادة';
            renderShareInChips();
            document.getElementById('shareInModal').style.display = 'flex';
        }

        function renderShareInChips() {
            document.getElementById('sharein-subjects').innerHTML = SUBJECTS.map(s => `
                <button class="chip-pick ${shareIn.subject === s.id ? 'selected' : ''}" style="--c: ${s.color};"
                        onclick="shareIn.subject='${s.id}'; renderShareInChips();">${s.icon} ${s.name}</button>`).join('');
            document.getElementById('sharein-type').innerHTML = [['video', '▶️ شرح فيديو'], ['pdf', '📖 ملف'], ['summary', '📝 ملخص']].map(([v, l]) => `
                <button class="chip-pick ${shareIn.type === v ? 'selected' : ''}" onclick="shareIn.type='${v}'; renderShareInChips();">${l}</button>`).join('');
        }

        // عند لصق رابط يوتيوب في نافذة الإضافة يُكتب عنوان الفيديو تلقائياً إن كان حقل العنوان فارغاً
        let autoTitleTimer = null;
        function autoTitleFromUrl(url) {
            clearTimeout(autoTitleTimer);
            if (!youtubeId(url)) return;
            autoTitleTimer = setTimeout(async () => {
                const input = document.getElementById('modal-title-input');
                if (input.value.trim()) return;
                input.placeholder = '⏳ جاري جلب عنوان الفيديو...';
                const t = await fetchLinkTitle(url.trim());
                input.placeholder = 'مثال: المحاضرة الأولى...';
                if (t && !input.value.trim()) { input.value = t; showToast('تم جلب عنوان الفيديو تلقائياً', '✨'); }
            }, 400);
        }

        function closeShareIn() { const m = document.getElementById('shareInModal'); if (m) m.style.display = 'none'; }

        async function fetchLinkTitle(url) {
            try { return (await api('/api/link-title?url=' + encodeURIComponent(url))).title; } catch (e) { return null; }
        }

        async function submitShareIn() {
            if (!shareIn) return;
            const title = document.getElementById('sharein-title').value.trim();
            if (!shareIn.subject) return showToast('اختر المادة أولاً', '⚠️');
            if (isAdmin() && !title) return showToast('اكتب عنواناً', '⚠️');
            const btn = document.getElementById('sharein-btn');
            btn.disabled = true;
            const subject = shareIn.subject;
            try {
                if (isAdmin()) {
                    const type = shareIn.type;
                    await api('/api/lectures/add', 'POST', {
                        subject_id: subject, title: (KIND_PREFIX[type] || '[PDF]') + title, file_url: shareIn.url, type,
                    });
                    showToast('تمت الإضافة وأُرسل إشعار للطلاب', '🎉');
                    checkForNew(true);
                    closeShareIn();
                    openSubject(subject, TAB_OF[type] || 'files');
                } else {
                    const note = document.getElementById('sharein-note').value.trim();
                    const q = `${note ? note + '\n\n' : ''}🎬 ${title || 'رابط مفيد'}\n${shareIn.url}`.slice(0, 1000);
                    await api('/api/questions/add', 'POST', { subject_id: subject, q_text: q, asker: currentUser.name });
                    showToast('تمت المشاركة في نقاش المادة', '🎉');
                    closeShareIn();
                    openSubject(subject, 'qa');
                }
                shareIn = null;
            } catch (e) {
                showToast('تعذر الإضافة، حاول مجدداً', '❌');
            } finally {
                btn.disabled = false;
            }
        }

        function shareLecture(id) {
            const item = window.lectureMap[id];
            if (!item) return;
            const icon = KIND_UI[lecKind(item.title)].icon;
            const sub = SUBJECTS.find(s => s.id === item.subject_id);
            const title = item.title.replace(PREFIX_RE, '');
            shareContent({
                title,
                text: `${icon} ${title}${sub ? ' — ' + sub.name : ''}\n📲 كل ملفات المادة: ${SITE}/#subject-${item.subject_id}`,
                url: item.file_url,
            });
        }

        function shareMessage(id) {
            const msg = (window.weeklyMessages || []).find(m => Number(m.id) === Number(id));
            if (!msg) return;
            const text = (msg.text || '').length > 600 ? msg.text.slice(0, 600) + '…' : (msg.text || '🖼️ صور التبليغ');
            shareContent({ title: 'تبليغ للدفعة', text: `📣 تبليغ للدفعة (${msg.date})\n\n${text}`, url: `${SITE}/#batch` });
        }

        function shareApp() {
            shareContent({
                title: 'مساعد دراسي',
                text: '🎓 منصة دفعة علوم الذكاء الاصطناعي: الملفات والشروحات والأسئلة والتبليغات بمكان واحد',
                url: SITE,
            });
        }

        function copyLink(id) {
            const item = window.lectureMap[id];
            if (item) copyText(item.file_url, 'تم نسخ الرابط بنجاح');
        }

        function editLecture(id) {
            const item = window.lectureMap[id];
            if (!item) return;
            const prefix = (item.title.match(PREFIX_RE) || [''])[0];
            const current = item.title.slice(prefix.length);
            const next = prompt('عنوان جديد:', current);
            if (next === null || !next.trim()) return;
            api(`/api/lectures/${id}`, 'PUT', { title: prefix + next.trim() })
            .then(() => fetchMedia(activeSubTab))
            .catch(() => alert('تعذر التعديل'));
        }

        function openAddModal(type) {
            document.getElementById('addModal').style.display = 'flex';
            document.getElementById('modal-type').value = type;
            document.getElementById('modal-title').innerText = (KIND_UI[type] || KIND_UI.pdf).modal;
            document.getElementById('modal-title-input').value = '';
            document.getElementById('modal-url-input').value = '';
            document.getElementById('save-btn').style.background = (KIND_UI[type] || KIND_UI.pdf).color;
            setTimeout(() => document.getElementById('modal-title-input').focus(), 50);
        }

        function closeAddModal() { document.getElementById('addModal').style.display = 'none'; }

        function submitContent() {
            const title = document.getElementById('modal-title-input').value.trim();
            const url = document.getElementById('modal-url-input').value.trim();
            const type = document.getElementById('modal-type').value;

            if (!title || !url) return alert('يرجى ملء جميع الحقول');
            if (!/^https?:\/\//i.test(url)) return alert('الرابط يجب أن يبدأ بـ http:// أو https://');

            const finalTitle = (KIND_PREFIX[type] || '[PDF]') + title;
            const btn = document.getElementById('save-btn');
            btn.innerText = 'جاري الحفظ...'; btn.disabled = true;

            api('/api/lectures/add', 'POST', { subject_id: currentSubjectId, title: finalTitle, file_url: url, type })
            .then(() => { closeAddModal(); fetchMedia(TAB_OF[type] || 'files'); checkForNew(true); })
            .catch(() => alert('خطأ في الإضافة'))
            .finally(() => { btn.innerText = 'حفظ ونشر'; btn.disabled = false; });
        }

        function deleteLecture(id) {
            if (!confirm('هل أنت متأكد من الحذف النهائي؟')) return;
            api(`/api/lectures/${id}`, 'DELETE').then(() => fetchMedia(activeSubTab)).catch(() => alert('تعذر الحذف'));
        }

        // ---------- صور السبورة ----------
        const MAX_BOARD_IMAGES = 30;
        let boardPending = [];      // صور مختارة بانتظار الرفع (مضغوطة)
        let boardUploading = false;
        window.boardMap = {};

        function fetchBoard() {
            const container = document.getElementById('sub-view-container');
            const forSubject = currentSubjectId;
            container.innerHTML = skeleton(2);
            api(`/api/board/${encodeURIComponent(forSubject)}`)
            .then(posts => {
                if (activeSubTab !== 'board' || currentSubjectId !== forSubject || !document.body.contains(container)) return;
                posts = posts || [];
                posts.forEach(p => { window.boardMap[p.id] = p; });
                const uploader = isAdmin() ? `
                    <div class="board-new">
                        <div style="font-weight: 700;">📷 رفع صور سبورة جديدة</div>
                        <input type="text" id="board-title" class="input-field" maxlength="200" placeholder="الموضوع: مثلاً شرح الحلقات - المحاضرة الثالثة">
                        <div class="uploader">
                            <input type="file" id="board-files" accept="image/*" multiple hidden onchange="addBoardImages(this.files); this.value='';">
                            <input type="file" id="board-camera" accept="image/*" capture="environment" hidden onchange="addBoardImages(this.files); this.value='';">
                            <button class="upload-btn" onclick="document.getElementById('board-camera').click()">📸 تصوير</button>
                            <button class="upload-btn" onclick="document.getElementById('board-files').click()">🖼️ من المعرض</button>
                            <span class="upload-progress" id="board-progress"></span>
                        </div>
                        <div class="previews" id="board-previews"></div>
                        <button class="btn btn-success" id="board-publish-btn" onclick="publishBoard()">نشر الصور</button>
                    </div>` : '';
                const list = posts.filter(p => (p.image_ids || []).length || isAdmin());
                const body = list.length
                    ? list.map(boardPostHTML).join('')
                    : `<div class="empty-state">🖼️ لا توجد صور سبورة حتى الآن.</div>`;
                container.innerHTML = uploader + body;
                renderBoardPreviews();
            })
            .catch(err => {
                container.innerHTML = `<div class="empty-state" style="color: red;">❌ فشل الاتصال بالخادم (${esc(err.message)}).</div>`;
            });
        }

        function boardPostHTML(p) {
            const ids = p.image_ids || [];
            const id = Number(p.id);
            const admin = isAdmin();
            const when = fmtTime(p.created_at);
            const cells = ids.map(i => `
                <div class="board-cell">
                    <img src="/api/board-images/${Number(i)}" loading="lazy" alt="صورة سبورة" onclick="openLightboxFrom(this)">
                    ${admin ? `<button class="img-del" title="حذف الصورة" onclick="deleteBoardImage(${Number(i)})">&times;</button>` : ''}
                </div>`).join('');
            return `
                <div class="board-post reveal" id="board-${id}">
                    <div class="board-head">
                        <div class="board-title">🖼️ ${esc(p.title)}${admin && !p.published ? '<span class="board-chip">غير منشور</span>' : ''}
                            <div class="board-meta">${ids.length} صورة${when ? ' • ' + esc(when) : ''}</div>
                        </div>
                        <div class="board-actions">
                            ${p.published ? `<button class="act-icon" title="مشاركة" onclick="shareBoard(${id})">📤</button>` : ''}
                            ${admin ? `
                                <input type="file" id="board-more-${id}" accept="image/*" multiple hidden onchange="addMoreBoardImages(${id}, this.files); this.value='';">
                                <button class="act-icon" title="إضافة صور" onclick="document.getElementById('board-more-${id}').click()">➕</button>
                                ${!p.published && ids.length ? `<button class="act-icon" title="نشر" onclick="publishBoardPost(${id})">📢</button>` : ''}
                                <button class="act-icon" title="تعديل الموضوع" onclick="editBoard(${id})">✏️</button>
                                <button class="btn-delete" title="حذف الموضوع" onclick="deleteBoard(${id})">🗑️</button>` : ''}
                        </div>
                    </div>
                    ${ids.length ? `<div class="board-grid n${Math.min(ids.length, 3) === 3 ? 3 : ids.length}">${cells}</div>`
                                 : '<div class="board-meta" style="margin-top: 8px;">لا توجد صور بعد.</div>'}
                </div>`;
        }

        // صور السبورة تحتاج وضوحاً أعلى للكتابة الصغيرة
        const compressBoard = f => compressImage(f, 1800, 0.78);

        async function addBoardImages(files) {
            const list = Array.from(files || []).filter(f => f.type.startsWith('image/'));
            const prog = document.getElementById('board-progress');
            for (const [n, f] of list.entries()) {
                if (boardPending.length >= MAX_BOARD_IMAGES) { showToast(`الحد الأقصى ${MAX_BOARD_IMAGES} صورة`, '⚠️'); break; }
                if (prog) prog.textContent = `⏳ تجهيز ${n + 1} من ${list.length}...`;
                try { boardPending.push(await compressBoard(f)); }
                catch (e) { showToast('تعذر قراءة إحدى الصور', '❌'); }
            }
            if (prog) prog.textContent = '';
            renderBoardPreviews();
        }

        function removeBoardPending(i) { boardPending.splice(i, 1); renderBoardPreviews(); }

        function renderBoardPreviews() {
            const box = document.getElementById('board-previews');
            if (!box) return;
            box.innerHTML = boardPending.map((src, i) => `
                <div class="preview"><img src="${src}" alt=""><button onclick="removeBoardPending(${i})" title="إزالة">&times;</button></div>
            `).join('');
            const btn = document.getElementById('board-publish-btn');
            if (btn && !boardUploading) btn.textContent = boardPending.length ? `نشر ${boardPending.length} صورة` : 'نشر الصور';
        }

        // رفع الصور واحدة واحدة مع إعادة المحاولة مرة عند الفشل
        async function uploadBoardImages(postId, images, onProgress) {
            let ok = 0;
            for (let i = 0; i < images.length; i++) {
                onProgress(i + 1, images.length);
                try { await api(`/api/board/${postId}/image`, 'POST', { image: images[i] }); ok++; }
                catch (e) {
                    try { await api(`/api/board/${postId}/image`, 'POST', { image: images[i] }); ok++; }
                    catch (e2) { /* نكمل البقية */ }
                }
            }
            return ok;
        }

        async function publishBoard() {
            if (boardUploading) return;
            const titleEl = document.getElementById('board-title');
            const title = titleEl.value.trim();
            if (!title) { titleEl.focus(); return showToast('اكتب موضوع الصور', '⚠️'); }
            if (!boardPending.length) return showToast('أضف صورة واحدة على الأقل', '⚠️');
            const btn = document.getElementById('board-publish-btn');
            const subject = currentSubjectId;
            const images = boardPending.slice();
            boardUploading = true;
            btn.disabled = true;
            try {
                const { id } = await api('/api/board/add', 'POST', { subject_id: subject, title });
                const ok = await uploadBoardImages(id, images, (n, total) => { btn.textContent = `⏳ جاري رفع ${n} من ${total}...`; });
                if (!ok) throw new Error('upload');
                btn.textContent = '⏳ جاري النشر...';
                await api(`/api/board/${id}/publish`, 'POST', {});
                boardPending = [];
                titleEl.value = '';
                showToast(ok === images.length ? 'تم نشر الصور وأُرسل إشعار للطلاب' : `نُشرت ${ok} من ${images.length} صورة`, ok === images.length ? '🎉' : '⚠️');
                checkForNew(true);
            } catch (e) {
                showToast('تعذر الرفع، تحقق من الإنترنت وحاول مجدداً', '❌');
            } finally {
                boardUploading = false;
                btn.disabled = false;
                if (activeSubTab === 'board' && currentSubjectId === subject) fetchBoard();
            }
        }

        async function addMoreBoardImages(postId, files) {
            const list = Array.from(files || []).filter(f => f.type.startsWith('image/'));
            if (!list.length) return;
            showToast(`⏳ جاري رفع ${list.length} صورة...`, '📤');
            const images = [];
            for (const f of list) { try { images.push(await compressBoard(f)); } catch (e) {} }
            const ok = await uploadBoardImages(postId, images, () => {});
            showToast(ok ? `تمت إضافة ${ok} صورة` : 'تعذر رفع الصور', ok ? '✅' : '❌');
            fetchBoard();
        }

        function publishBoardPost(id) {
            api(`/api/board/${id}/publish`, 'POST', {})
            .then(() => { showToast('تم النشر وأُرسل إشعار للطلاب', '🎉'); fetchBoard(); })
            .catch(() => showToast('تعذر النشر', '❌'));
        }

        function editBoard(id) {
            const p = window.boardMap[id];
            if (!p) return;
            const next = prompt('الموضوع الجديد:', p.title);
            if (next === null || !next.trim()) return;
            api(`/api/board/${id}`, 'PUT', { title: next.trim() }).then(fetchBoard).catch(() => showToast('تعذر التعديل', '❌'));
        }

        function deleteBoard(id) {
            if (!confirm('حذف الموضوع وكل صوره نهائياً؟')) return;
            api(`/api/board/${id}`, 'DELETE').then(fetchBoard).catch(() => showToast('تعذر الحذف', '❌'));
        }

        function deleteBoardImage(imgId) {
            if (!confirm('حذف هذه الصورة؟')) return;
            api(`/api/board-images/${imgId}`, 'DELETE').then(fetchBoard).catch(() => showToast('تعذر الحذف', '❌'));
        }

        function shareBoard(id) {
            const p = window.boardMap[id];
            if (!p) return;
            const sub = SUBJECTS.find(s => s.id === p.subject_id);
            shareContent({
                title: p.title,
                text: `🖼️ صور السبورة: ${p.title}${sub ? ' — ' + sub.name : ''}`,
                url: `${SITE}/#subject-${p.subject_id}/board`,
            });
        }

        // ---------- الأسئلة والمراسلة ----------
        function fetchQA() {
            const container = document.getElementById('sub-view-container');
            const admin = isAdmin();
            container.innerHTML = `
                <div class="qa-compose ${admin ? 'qa-compose-admin' : ''}">
                    <div class="qa-compose-title">${admin ? '📢 أرسل رسالة للطلاب في هذه المادة' : '❓ اطرح سؤالاً'}</div>
                    <textarea id="new-q-text" class="input-field" rows="3" maxlength="1000"
                        placeholder="${admin ? 'اكتب رسالة أو توجيه لطلاب هذه المادة...' : 'لديك سؤال حول المادة؟ اكتبه هنا...'}"></textarea>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn ${admin ? 'btn-success' : ''}" id="ask-btn" onclick="askQuestion()">${admin ? '📢 نشر الرسالة' : '✉️ إرسال السؤال'}</button>
                        <button class="btn btn-outline" style="width: auto;" onclick="loadQAList()">🔄 تحديث</button>
                    </div>
                </div>
                <div id="qa-list">${skeleton(2)}</div>
            `;
            loadQAList();
        }

        // يحدّث قائمة المحادثات فقط (بدون مسح ما يكتبه المستخدم في خانة السؤال)
        function loadQAList() {
            api(`/api/questions/${encodeURIComponent(currentSubjectId)}`)
            .then(data => {
                const qaList = document.getElementById('qa-list');
                if (!qaList) return;
                if (!data || data.length === 0) {
                    qaList.innerHTML = '<div class="empty-state">💬 لا توجد محادثات في هذه المادة بعد.</div>';
                    return;
                }
                qaList.innerHTML = data.map(threadHTML).join('');
            })
            .catch(() => {
                const el = document.getElementById('qa-list');
                if (el) el.innerHTML = '<div class="empty-state" style="color: red;">❌ فشل جلب المحادثات.</div>';
            });
        }

        function replyHTML(r) {
            return `
                <div class="reply ${r.is_admin ? 'reply-admin' : 'reply-student'}">
                    <div class="who">
                        ${avatarHTML(r.author, r.is_admin)} <b>${esc(r.author)}</b>
                        <span class="when">${fmtTime(r.created_at)}</span>
                        ${isAdmin() ? `<button class="mini-del" title="حذف الرد" onclick="deleteReply(${Number(r.id)})">🗑️</button>` : ''}
                    </div>
                    <div>${linkify(r.text)}</div>
                </div>
            `;
        }

        function threadHTML(q) {
            const admin = isAdmin();
            const replies = q.replies || [];
            const answered = !!q.a_text || replies.some(r => r.is_admin);
            const chip = q.is_admin ? '' : (answered ? '<span class="chip chip-ok">✅ تمت الإجابة</span>' : '<span class="chip chip-wait">⏳ بانتظار الإجابة</span>');
            return `
                <div class="thread reveal ${q.is_admin ? 'thread-admin' : ''}">
                    <div class="thread-head">
                        <div class="who">
                            ${avatarHTML(q.asker, q.is_admin)} <b>${esc(q.asker || (q.is_admin ? 'الأدمن' : 'طالب'))}</b>
                            ${q.is_admin ? '<span class="chip chip-admin">📢 رسالة من الأدمن</span>' : ''}
                            <span class="when">${fmtTime(q.created_at)}</span>
                        </div>
                        <div style="display: flex; gap: 8px; align-items: center;">
                            ${chip}
                            ${admin ? `<button class="btn-delete" title="حذف المحادثة" onclick="deleteQuestion(${Number(q.id)})">🗑️</button>` : ''}
                        </div>
                    </div>
                    <div class="thread-text">${linkify(q.q_text)}</div>
                    ${q.a_text ? `<div class="reply reply-admin"><div class="who">👨‍🏫 <b>الأدمن</b></div><div>${linkify(q.a_text)}</div></div>` : ''}
                    ${replies.map(replyHTML).join('')}
                    <div class="reply-box">
                        <input type="text" id="reply-${q.id}" class="input-field" maxlength="2000"
                               placeholder="${admin ? 'اكتب ردك على الطلاب...' : 'اكتب رداً...'}"
                               onkeydown="if(event.key==='Enter') sendReply(${Number(q.id)})">
                        <button class="btn ${admin ? 'btn-success' : ''}" id="reply-btn-${Number(q.id)}" style="width: auto;" onclick="sendReply(${Number(q.id)})">${admin ? '👨‍🏫 رد' : '↩️ رد'}</button>
                    </div>
                </div>
            `;
        }

        function askQuestion() {
            const input = document.getElementById('new-q-text');
            const btn = document.getElementById('ask-btn');
            const text = input.value.trim();
            if (!text) return showToast('اكتب سؤالك أولاً', '⚠️');
            if (btn.disabled) return;
            btn.disabled = true;
            api('/api/questions/add', 'POST', { subject_id: currentSubjectId, q_text: text, asker: currentUser.name })
            .then(() => { input.value = ''; showToast(isAdmin() ? 'تم نشر الرسالة' : 'تم إرسال سؤالك'); loadQAList(); })
            .catch(() => showToast('تعذر الإرسال', '❌'))
            .finally(() => { btn.disabled = false; });
        }

        function sendReply(qId) {
            const input = document.getElementById(`reply-${qId}`);
            const btn = document.getElementById(`reply-btn-${qId}`);
            const text = input.value.trim();
            if (!text || (btn && btn.disabled)) return;
            if (btn) btn.disabled = true;
            api(`/api/questions/${qId}/reply`, 'POST', { text, author: currentUser.name })
            .then(() => { showToast('تم إرسال الرد'); loadQAList(); })
            .catch(() => { showToast('تعذر إرسال الرد', '❌'); if (btn) btn.disabled = false; });
        }

        function deleteQuestion(id) { if (confirm('حذف المحادثة؟')) api(`/api/questions/${id}`, 'DELETE').then(() => loadQAList()).catch(() => showToast('تعذر الحذف', '❌')); }
        function deleteReply(id) { if (confirm('حذف الرد؟')) api(`/api/replies/${id}`, 'DELETE').then(() => loadQAList()).catch(() => showToast('تعذر الحذف', '❌')); }

        // ---------- الرسائل الأسبوعية ----------
        function fetchWeeklyMessages() {
            const container = document.getElementById('messages-container');
            if (!container) return;
            api('/api/messages').then(msgs => {
                window.weeklyMessages = msgs || [];
                if (window.weeklyMessages.length === 0) {
                    container.innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 20px; border: 1px dashed var(--border); border-radius: 8px;">لا توجد رسائل أسبوعية حتى الآن.</div>';
                    return;
                }
                markMessagesViewed(window.weeklyMessages[0].id);
                container.innerHTML = window.weeklyMessages.map((msg, index) => `
                    <div class="week-msg reveal ${index === 0 ? 'latest' : ''}">
                        <div class="week-msg-head">
                            <div class="week-msg-date">
                                <span class="week-chip">${index === 0 ? '🆕 الأحدث' : 'الأسبوع ' + (window.weeklyMessages.length - index)}</span>
                                ${esc(msg.date)}
                            </div>
                            <div class="week-msg-actions">
                                <button onclick="shareMessage(${Number(msg.id)})" style="color: #5eead4;">مشاركة 📤</button>
                                ${isAdmin() ? `
                                    <button onclick="editMessage(${Number(msg.id)})" style="color: var(--primary);">تعديل ✏️</button>
                                    <button onclick="deleteMessage(${Number(msg.id)})" style="color: var(--danger);">حذف 🗑️</button>
                                ` : ''}
                            </div>
                        </div>
                        ${msg.text ? `<div class="week-msg-text">${linkify(msg.text)}</div>` : ''}
                        ${galleryHTML(msg)}
                    </div>
                `).join('');
            }).catch(() => {
                container.innerHTML = '<div class="empty-state" style="color: red;">❌ فشل جلب الرسائل.</div>';
            });
        }

        // ---------- صور الرسالة الأسبوعية ----------
        const MAX_IMAGES = 6;
        let pendingImages = [];

        function galleryHTML(msg) {
            const srcs = (msg.image_ids || []).map(id => `/api/images/${Number(id)}`);
            if (msg.image_url && safeUrl(msg.image_url) !== '#') srcs.push(msg.image_url);
            if (!srcs.length) return '';
            return `<div class="gallery n${Math.min(srcs.length, 6)}">` + srcs.map(s =>
                `<img src="${esc(s)}" loading="lazy" alt="صورة مرفقة" onclick="openLightboxFrom(this)">`).join('') + '</div>';
        }

        // عارض الصور: يدعم التنقل بين صور نفس المجموعة (أسهم، سحب بالإصبع، لوحة المفاتيح) وحفظ الصورة
        let lbList = [], lbIndex = 0;
        function openLightbox(src, list) {
            lbList = (list && list.length) ? list : [src];
            lbIndex = Math.max(0, lbList.indexOf(src));
            showLightboxImage();
            document.getElementById('lightbox').classList.add('show');
        }
        // يفتح الصورة مع بقية صور المجموعة نفسها
        function openLightboxFrom(img) {
            const group = img.closest('.gallery, .board-grid');
            const list = group ? [...group.querySelectorAll('img')].map(i => i.src) : [img.src];
            openLightbox(img.src, list);
        }
        function showLightboxImage() {
            const src = lbList[lbIndex];
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox').classList.toggle('multi', lbList.length > 1);
            document.getElementById('lightbox-count').textContent = `${lbIndex + 1} / ${lbList.length}`;
            const dl = document.getElementById('lightbox-dl');
            dl.href = src;
            dl.setAttribute('download', 'صورة-' + (src.match(/(\d+)(?:\?.*)?$/) || ['', lbIndex + 1])[1] + '.jpg');
        }
        function lightboxStep(d) {
            if (lbList.length < 2) return;
            lbIndex = (lbIndex + d + lbList.length) % lbList.length;
            showLightboxImage();
        }
        function closeLightbox() { document.getElementById('lightbox').classList.remove('show'); }
        (function () {
            const lb = document.getElementById('lightbox');
            let x0 = null;
            lb.addEventListener('touchstart', e => { x0 = e.touches.length === 1 ? e.touches[0].clientX : null; }, { passive: true });
            lb.addEventListener('touchend', e => {
                if (x0 === null) return;
                const dx = e.changedTouches[0].clientX - x0;
                x0 = null;
                if (Math.abs(dx) > 50) lightboxStep(dx > 0 ? 1 : -1); // السحب لليمين = التالية (الاتجاه عربي)
            });
            document.addEventListener('keydown', e => {
                if (!lb.classList.contains('show')) return;
                if (e.key === 'ArrowLeft') lightboxStep(1);
                if (e.key === 'ArrowRight') lightboxStep(-1);
            });
        })();

        // تصغير الصورة وضغطها في المتصفح قبل الرفع (أسرع وأوفر للإنترنت)
        function compressImage(file, maxSide = 1400, quality = 0.72) {
            return new Promise((resolve, reject) => {
                const url = URL.createObjectURL(file);
                const img = new Image();
                img.onload = () => {
                    const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.round(img.width * scale);
                    canvas.height = Math.round(img.height * scale);
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    URL.revokeObjectURL(url);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('bad image')); };
                img.src = url;
            });
        }

        async function addPendingImages(files) {
            const list = Array.from(files || []).filter(f => f.type.startsWith('image/'));
            for (const f of list) {
                if (pendingImages.length >= MAX_IMAGES) { showToast(`الحد الأقصى ${MAX_IMAGES} صور`, '⚠️'); break; }
                try { pendingImages.push(await compressImage(f)); }
                catch (e) { showToast('تعذر قراءة إحدى الصور', '❌'); }
            }
            renderPreviews();
        }

        function removePendingImage(i) { pendingImages.splice(i, 1); renderPreviews(); }

        function renderPreviews() {
            const box = document.getElementById('msg-previews');
            if (!box) return;
            box.innerHTML = pendingImages.map((src, i) => `
                <div class="preview"><img src="${src}" alt=""><button onclick="removePendingImage(${i})" title="إزالة">&times;</button></div>
            `).join('');
        }

        function addWeeklyMessage() {
            const input = document.getElementById('new-msg-input');
            const btn = document.getElementById('publish-msg-btn');
            const text = input.value.trim();

            if (!text && !pendingImages.length) return showToast('اكتب نصاً أو أضف صورة', '⚠️');

            btn.disabled = true;
            btn.innerText = pendingImages.length ? 'جاري الرفع...' : 'جاري النشر...';
            api('/api/messages/add', 'POST', { text, images: pendingImages, date: new Date().toLocaleDateString('ar-IQ') })
            .then(() => {
                input.value = '';
                pendingImages = [];
                renderPreviews();
                showToast('تم نشر الرسالة');
                fetchWeeklyMessages();
                checkForNew(true);
            })
            .catch(() => showToast('تعذر نشر الرسالة', '❌'))
            .finally(() => { btn.disabled = false; btn.innerText = 'نشر'; });
        }

        function editMessage(id) {
            const msg = (window.weeklyMessages || []).find(m => Number(m.id) === Number(id));
            if (!msg) return;
            document.getElementById('edit-msg-id').value = id;
            document.getElementById('edit-msg-text').value = msg.text || '';
            document.getElementById('editMsgModal').style.display = 'flex';
        }

        function closeEditMsg() {
            document.getElementById('editMsgModal').style.display = 'none';
        }

        function saveEditedMessage() {
            const id = Number(document.getElementById('edit-msg-id').value);
            const text = document.getElementById('edit-msg-text').value.trim();
            const msg = (window.weeklyMessages || []).find(m => Number(m.id) === id);

            if (!text && !(msg && msg.image_url)) return showToast('الرسالة فارغة', '⚠️');

            const btn = document.getElementById('edit-msg-save');
            btn.disabled = true;
            api(`/api/messages/${id}`, 'PUT', { text })
            .then(() => {
                closeEditMsg();
                showToast('تم تعديل الرسالة بنجاح');
                fetchWeeklyMessages();
            })
            .catch(() => showToast('تعذر التعديل', '❌'))
            .finally(() => { btn.disabled = false; });
        }

        function deleteMessage(id) {
            if (confirm('حذف الرسالة؟')) {
                api(`/api/messages/${id}`, 'DELETE')
                .then(() => fetchWeeklyMessages())
                .catch(() => showToast('تعذر الحذف', '❌'));
            }
        }

        if (window.hookSounds) hookSounds();
        init();
    </script>
</body>
</html>
