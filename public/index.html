<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="مساعد دراسي لطلاب علوم الذكاء الاصطناعي - المرحلة الثانية: ملفات، شروحات، أسئلة وتبليغات الدفعة.">
    <link rel="icon" href="/icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <title>مساعد دراسي | الذكاء الاصطناعي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --item-bg: #162032;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981;
            --warning: #f59e0b;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        * { -webkit-tap-highlight-color: transparent; } /* يمنع الوميض الأزرق عند لمس الأزرار */

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            overscroll-behavior-y: none; /* يمنع التحديث عند سحب الشاشة للأسفل */
            -webkit-user-select: none; /* يمنع تحديد النصوص عند الضغط المطول بالخطأ */
            user-select: none;
        }

        /* استثناء حقول الإدخال والنصوص ليتمكن الطلاب من الكتابة والنسخ */
        .input-field, textarea, input, .selectable, .thread-text, .reply, .week-msg-text {
            -webkit-user-select: auto;
            user-select: auto;
        }

        header {
            background-color: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 15px 20px; position: sticky; top: 0; z-index: 100;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-size: 20px; font-weight: 700; color: var(--primary); }
        nav { display: flex; gap: 10px; flex-wrap: wrap; }

        .nav-btn {
            background: transparent; border: 1px solid var(--border); color: var(--text-muted);
            padding: 8px 16px; border-radius: 8px; cursor: pointer; transition: 0.3s; font-weight: 500;
        }
        .nav-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        main { max-width: 1000px; margin: 30px auto; padding: 0 20px; }

        .grid-container {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; align-items: start;
        }

        .card {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
            padding: 20px; display: flex; flex-direction: column; gap: 10px; transition: 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.25);
            border-color: var(--primary);
        }
        .card-title { font-size: 18px; font-weight: 700; color: var(--text-main); }

        .input-field {
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--bg-color); color: white; margin-bottom: 10px; font-family: 'Tajawal'; outline: none;
        }
        .input-field:focus { border-color: var(--primary); }

        .btn {
            display: inline-block; text-align: center; background: var(--primary); color: #fff;
            padding: 10px 15px; border-radius: 8px; text-decoration: none; border: none;
            cursor: pointer; font-weight: 500; width: 100%; transition: 0.3s;
        }
        .btn:hover { background: var(--primary-hover); }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-danger:hover { background: var(--danger-hover); }
        .btn-success { background: var(--success); }
        .btn-outline { background: transparent; border: 1px solid var(--text-muted); color: var(--text-main); }
        .btn-delete { background: transparent; border: 1px solid var(--danger); color: var(--danger); padding: 8px 12px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .btn-delete:hover { background: var(--danger); color: white; }

        .sub-tabs { display: flex; gap: 15px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; overflow-x: auto; white-space: nowrap; }
        .sub-tab-btn { background: transparent; border: none; color: var(--text-muted); font-size: 16px; cursor: pointer; padding: 5px 10px; }
        .sub-tab-btn.active { color: var(--primary); font-weight: bold; border-bottom: 2px solid var(--primary); }

        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); border: 2px dashed var(--border); border-radius: 12px; }
        .admin-panel { background: rgba(59, 130, 246, 0.05); border: 1px dashed var(--primary); border-radius: 12px; padding: 20px; margin-top: 20px; }

        .login-wrapper { max-width: 400px; margin: 100px auto; text-align: center; }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px); z-index: 1000;
            justify-content: center; align-items: center;
        }
        .modal-content {
            background: var(--card-bg); width: 90%; max-width: 450px; padding: 25px;
            border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .modal-header { font-size: 20px; font-weight: bold; margin-bottom: 20px; color: white; display: flex; justify-content: space-between; }
        .close-modal { cursor: pointer; color: var(--text-muted); font-size: 24px; border: none; background: none; }

        /* ---- ملفات وشروحات ---- */
        .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
            background: rgba(59,130,246,0.07); border: 1px dashed var(--primary); border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; }
        .toolbar-info { color: var(--text-muted); font-weight: 500; }
        .btn-add { border: none; color: #fff; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 15px; transition: 0.2s; }
        .btn-add:hover { transform: translateY(-1px); filter: brightness(1.1); }
        .btn-add-file { background: var(--primary); }
        .btn-add-video { background: var(--danger); }
        .media-item { background: var(--item-bg); padding: 14px 16px; border-radius: 12px; border: 1px solid var(--border);
            display: flex; align-items: center; gap: 14px; margin-bottom: 12px; flex-wrap: wrap; transition: transform 0.2s; }
        .media-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
        .media-info { flex: 1; min-width: 150px; }
        .media-title { font-weight: 700; font-size: 16px; color: #fff; word-break: break-word; }
        .media-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
        .media-actions { display: flex; gap: 8px; align-items: center; }

        .act-open { color: #fff; padding: 8px 18px; border-radius: 8px; text-decoration: none; font-weight: 700; display: flex; align-items: center; gap: 6px; }

        .act-icon { background: transparent; border: 1px solid var(--border); color: var(--text-main); padding: 8px 11px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .act-icon:hover { background: var(--border); }
        .role-badge { font-size: 12px; background: rgba(245,158,11,0.15); color: var(--warning); padding: 2px 10px; border-radius: 12px; margin-right: 8px; }

        .drag-handle { cursor: grab; font-size: 20px; color: var(--text-muted); display: flex; align-items: center; justify-content: center; width: 30px; }
        .drag-handle:active { cursor: grabbing; color: var(--primary); }
        .sortable-ghost { opacity: 0.4; background: rgba(59, 130, 246, 0.1); border: 1px dashed var(--primary); }

        /* ---- الأسئلة والمراسلة ---- */
        .qa-compose { background: var(--item-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 20px; }
        .qa-compose-admin { border-color: var(--warning); background: rgba(245,158,11,0.05); }
        .qa-compose-title { font-weight: 700; margin-bottom: 10px; }
        textarea.input-field { resize: vertical; min-height: 70px; }
        .thread { background: var(--item-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
        .thread-admin { border-color: var(--warning); }
        .thread-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
        .who { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .when { font-size: 12px; color: var(--text-muted); }
        .thread-text { color: #fff; white-space: pre-wrap; word-break: break-word; margin-bottom: 10px; }
        .chip { font-size: 12px; padding: 2px 10px; border-radius: 12px; font-weight: 500; }
        .chip-ok { background: rgba(16,185,129,0.15); color: var(--success); }
        .chip-wait { background: rgba(245,158,11,0.15); color: var(--warning); }
        .chip-admin { background: rgba(245,158,11,0.2); color: var(--warning); }
        .reply { border-radius: 8px; padding: 10px 12px; margin: 8px 0; white-space: pre-wrap; word-break: break-word; position: relative; }
        .reply-admin { background: rgba(16,185,129,0.1); border-right: 3px solid var(--success); }
        .reply-student { background: rgba(59,130,246,0.08); border-right: 3px solid var(--primary); }
        .reply .who { font-size: 13px; margin-bottom: 3px; }
        .reply-box { display: flex; gap: 8px; margin-top: 10px; }
        .reply-box .input-field { margin: 0; padding: 8px 10px; }
        .mini-del { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 14px; }

        /* ---- الرسائل الأسبوعية ---- */
        .week-msg { background: var(--item-bg); border-right: 4px solid var(--warning); padding: 15px; margin-bottom: 10px; border-radius: 4px; }
        .week-msg-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
        .week-msg-date { font-size: 12px; color: var(--text-muted); }
        .week-msg-actions { display: flex; gap: 12px; }
        .week-msg-actions button { background: none; border: none; cursor: pointer; font-size: 13px; }
        .week-msg-text { color: white; font-size: 15px; margin-bottom: 8px; white-space: pre-wrap; word-break: break-word; }

        /* تخصيص شريط التمرير بالكامل */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
        .btn:active, .nav-btn:active, .act-open:active, .act-icon:active, .sub-tab-btn:active {
            transform: scale(0.95); /* انكماش الزر عند اللمس */
            transition: transform 0.1s ease;
        }
        /* إخفاء شريط التمرير السفلي في التبويبات الفرعية فقط */
        .sub-tabs::-webkit-scrollbar { display: none; }
        .sub-tabs {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* إشعارات الهاتف (Toast) */
        #toast-container {
            position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%);
            opacity: 0;
            background: rgba(30, 41, 59, 0.95); color: #fff; padding: 12px 24px;
            border-radius: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            font-weight: 700; border: 1px solid var(--border);
            transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
            z-index: 9999; display: flex; align-items: center; gap: 10px;
            pointer-events: none; white-space: nowrap; backdrop-filter: blur(5px);
        }
        #toast-container.show { bottom: 40px; opacity: 1; }

        /* روابط داخل النصوص */
        .linkified { color: #60a5fa; text-decoration: underline; word-break: break-all; }

        /* إطار واضح عند التنقل بلوحة المفاتيح */
        button:focus-visible, a:focus-visible, .input-field:focus-visible {
            outline: 2px solid var(--primary); outline-offset: 2px;
        }

        /* عدد الملفات في بطاقة المادة */
        .sub-count { color: var(--text-muted); font-size: 13px; margin: -8px 0 12px; min-height: 20px; }
        .new-badge {
            display: none; position: absolute; top: 10px; right: 10px; background: var(--danger); color: #fff;
            padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 700; box-shadow: 0 0 10px rgba(239,68,68,0.6);
        }
        .new-badge { animation: pulse 2s infinite; }
        @keyframes pulse { 50% { box-shadow: 0 0 2px rgba(239,68,68,0.3); } }

        /* البحث داخل المادة */
        .search-box { position: relative; margin-bottom: 14px; }
        .search-box .input-field { margin: 0; padding-right: 38px; }
        .search-box::before { content: '🔍'; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 14px; opacity: 0.7; }
        .no-results { display: none; }

        /* صورة مصغرة لفيديوهات يوتيوب */
        .media-thumb { width: 86px; height: 48px; border-radius: 10px; object-fit: cover; flex-shrink: 0; border: 1px solid var(--border); background: #000; }

        /* هيكل التحميل */
        .skeleton { height: 76px; border-radius: 12px; margin-bottom: 12px; border: 1px solid var(--border);
            background: linear-gradient(90deg, var(--item-bg) 25%, #1f2b40 50%, var(--item-bg) 75%);
            background-size: 200% 100%; animation: shimmer 1.2s infinite linear; }
        @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

        .email-row { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; color: var(--text-muted); }
        .email-row a { color: var(--text-main); text-decoration: none; direction: ltr; }
        .email-row a:hover { color: var(--primary); }

        /* الهاتف */
        @media (max-width: 560px) {
            header { flex-direction: column; gap: 10px; padding: 12px 16px; }
            nav { justify-content: center; }
            .nav-btn { padding: 7px 12px; font-size: 14px; }
            main { margin: 20px auto; padding: 0 16px; }
            .media-actions { width: 100%; justify-content: flex-end; }
            .login-wrapper { margin: 40px auto; }
        }

        .push-prompt { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; padding: 14px 16px;
            background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.5); border-radius: 12px; }

        /* ---- الجرس والتنبيهات ---- */
        .bell-btn { font-size: 16px; padding: 6px 12px; }
        .bell-btn.on { border-color: var(--warning); background: rgba(245,158,11,0.12); }
        .nav-btn { position: relative; }
        .nav-dot { display: none; position: absolute; top: -4px; left: -4px; width: 10px; height: 10px; border-radius: 50%;
            background: var(--danger); box-shadow: 0 0 8px var(--danger); }
        #alert-banner {
            position: fixed; top: -120px; left: 50%; transform: translateX(-50%); width: min(92vw, 460px);
            background: rgba(30, 41, 59, 0.97); border: 1px solid var(--warning); border-radius: 14px;
            padding: 12px 14px; display: flex; gap: 12px; align-items: center; z-index: 9998; cursor: pointer;
            box-shadow: 0 12px 30px rgba(0,0,0,0.5); transition: top 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(8px);
        }
        #alert-banner.show { top: 14px; }
        #alert-icon { font-size: 26px; }
        #alert-title { font-weight: 700; color: var(--warning); }
        #alert-body { color: var(--text-main); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #alert-banner button { background: none; border: none; color: var(--text-muted); font-size: 22px; cursor: pointer; }

        /* ---- صور الرسالة الأسبوعية ---- */
        .gallery { display: grid; gap: 6px; margin-top: 10px; border-radius: 10px; overflow: hidden; }
        .gallery.n1 { grid-template-columns: 1fr; }
        .gallery.n2, .gallery.n4 { grid-template-columns: 1fr 1fr; }
        .gallery.n3, .gallery.n5, .gallery.n6 { grid-template-columns: repeat(3, 1fr); }
        .gallery img { width: 100%; height: 100%; aspect-ratio: 4 / 3; object-fit: cover; cursor: zoom-in; display: block;
            background: var(--bg-color); transition: filter 0.2s; }
        .gallery.n1 img { aspect-ratio: auto; max-height: 480px; object-fit: contain; }
        .gallery img:hover { filter: brightness(1.1); }

        .uploader { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .upload-btn { background: transparent; border: 1px dashed var(--primary); color: var(--primary); padding: 10px 14px;
            border-radius: 8px; cursor: pointer; font-weight: 700; }
        .upload-btn:hover { background: rgba(59,130,246,0.1); }
        .previews { display: flex; gap: 8px; flex-wrap: wrap; }
        .preview { position: relative; width: 72px; height: 72px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
        .preview img { width: 100%; height: 100%; object-fit: cover; }
        .preview button { position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; border: none;
            background: rgba(0,0,0,0.7); color: #fff; cursor: pointer; font-size: 14px; line-height: 1; }

        #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 10000;
            justify-content: center; align-items: center; padding: 16px; }
        #lightbox.show { display: flex; }
        #lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
        #lightbox button { position: absolute; top: 12px; right: 16px; background: none; border: none; color: #fff; font-size: 34px; cursor: pointer; }

        /* ---- تحسينات الشكل ---- */
        body { background:
            radial-gradient(circle at 15% 0%, rgba(59,130,246,0.10), transparent 40%),
            radial-gradient(circle at 85% 100%, rgba(139,92,246,0.08), transparent 45%),
            var(--bg-color); background-attachment: fixed; min-height: 100vh; }
        .subject-card { text-align: center; position: relative; border-top: 4px solid var(--accent); }
        .subject-card:hover { border-color: var(--accent); box-shadow: 0 10px 25px -5px var(--accent-glow); }
        .subject-icon { width: 76px; height: 76px; margin: 4px auto 12px; border-radius: 22px; display: flex; align-items: center;
            justify-content: center; font-size: 40px; background: var(--accent-soft); }
        .subject-card .btn { background: var(--accent); }
        .subject-card .btn:hover { filter: brightness(1.1); }
        .week-msg { border-radius: 10px; padding: 16px; margin-bottom: 14px; border: 1px solid var(--border); border-right: 4px solid var(--warning); }
        .week-msg.latest { border-color: var(--warning); box-shadow: 0 0 0 1px rgba(245,158,11,0.25), 0 8px 24px -10px rgba(245,158,11,0.35); }
        .week-chip { background: rgba(245,158,11,0.15); color: var(--warning); padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 700; margin-left: 6px; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }

        /* تأثير التلاشي عند تبديل المحتوى */
        .fade-in { animation: fadeInEffect 0.3s ease-in-out; }
        @keyframes fadeInEffect {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <header id="main-header" style="display: none;">

        <div class="logo">مساعد دراسي 🎓<span id="role-badge" class="role-badge" style="display:none;"></span></div>
        <nav>
            <button class="nav-btn active" data-tab="subjects" onclick="switchMainTab('subjects')">المواد الدراسية</button>
            <button class="nav-btn" data-tab="batch" onclick="switchMainTab('batch')">الدفعة<span class="nav-dot" id="batch-dot"></span></button>
            <button class="nav-btn bell-btn" id="bell-btn" onclick="toggleBell()" title="التنبيهات الصوتية">🔕</button>
            <button class="nav-btn" style="border: none; color: var(--danger);" onclick="logout()">خروج</button>
        </nav>
    </header>

    <main id="app-content"></main>
    <div id="toast-container"></div>

    <!-- تنبيه بمحتوى جديد (يظهر أعلى الشاشة) -->
    <div id="alert-banner" onclick="openAlertTarget()">
        <div id="alert-icon">🔔</div>
        <div style="flex: 1; min-width: 0;">
            <div id="alert-title"></div>
            <div id="alert-body"></div>
        </div>
        <button onclick="event.stopPropagation(); hideAlert()" aria-label="إغلاق">&times;</button>
    </div>

    <!-- عرض الصورة بالحجم الكامل -->
    <div id="lightbox" onclick="closeLightbox()">
        <img id="lightbox-img" alt="">
        <button aria-label="إغلاق">&times;</button>
    </div>

    <audio id="notify-sound" src="/notify.mp4" preload="auto"></audio>

    <!-- نافذة إضافة ملف / فيديو -->
    <div class="modal-overlay" id="addModal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modal-title">إضافة محتوى</span>
                <button class="close-modal" onclick="closeAddModal()">&times;</button>
            </div>
            <input type="hidden" id="modal-type">

            <label style="color: var(--text-muted); display: block; margin-bottom: 8px;">عنوان المحتوى:</label>
            <input type="text" id="modal-title-input" class="input-field" placeholder="مثال: المحاضرة الأولى...">

            <label style="color: var(--text-muted); display: block; margin-bottom: 8px;">الرابط (URL):</label>
            <input type="url" id="modal-url-input" class="input-field" placeholder="انسخ والصق الرابط هنا..." dir="ltr" onkeydown="if(event.key==='Enter') submitContent()">

            <button class="btn" id="save-btn" style="margin-top: 15px;" onclick="submitContent()">حفظ ونشر</button>
        </div>
    </div>

    <!-- نافذة تعديل الرسالة الأسبوعية -->
    <div class="modal-overlay" id="editMsgModal">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header">
                <span>✏️ تعديل الرسالة</span>
                <button class="close-modal" onclick="closeEditMsg()">&times;</button>
            </div>
            <input type="hidden" id="edit-msg-id">
            <textarea id="edit-msg-text" class="input-field" rows="10" style="min-height: 200px;"></textarea>
            <button class="btn" id="edit-msg-save" onclick="saveEditedMessage()">حفظ التعديل</button>
        </div>
    </div>

    <script>

        const API_URL = "";
        let currentUser = null;
        let currentTab = 'subjects';
        let currentSubjectId = null;
        let activeSubTab = 'files';

        const SUBJECTS = [
            { id: 'oop', name: 'برمجة شيئية', icon: '💻', color: '#3b82f6' },
            { id: 'num_analysis', name: 'التحليل العددي', icon: '📐', color: '#8b5cf6' },
            { id: 'computation', name: 'النظرية الاحتسابية', icon: '🧮', color: '#ec4899' },
            { id: 'python', name: 'لغة بايثون', icon: '🐍', color: '#10b981' },
            { id: 'arabic', name: 'اللغة العربية', icon: '📚', color: '#f59e0b' },
            { id: 'ai_algo', name: 'خوارزميات AI', icon: '🤖', color: '#06b6d4' }
        ];

        // ---------- أدوات مساعدة ----------
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '#';
        const isAdmin = () => currentUser && currentUser.role === 'admin';

        // يحوّل الروابط داخل النص إلى روابط قابلة للضغط (بعد تهريب النص)
        const linkify = s => esc(s).replace(/https?:\/\/[^\s<]+/g, u => {
            const trail = (u.match(/[.,;:!?)\]،]+$/) || [''])[0];
            const url = trail ? u.slice(0, -trail.length) : u;
            return `<a class="linkified" href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>${trail}`;
        });

        // توحيد الحروف العربية للبحث (أ إ آ = ا، ة = ه، ى = ي) وإزالة التشكيل
        const normAr = s => String(s || '').toLowerCase()
            .replace(/[ً-ْـ]/g, '')
            .replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي');

        const skeleton = (n = 3) => Array(n).fill('<div class="skeleton"></div>').join('');

        function youtubeId(url) {
            const m = String(url || '').match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/|\/live\/)([\w-]{11})/);
            return m ? m[1] : null;
        }

        function copyText(text, okMsg = 'تم النسخ') {
            const done = () => showToast(okMsg);
            if (navigator.clipboard) navigator.clipboard.writeText(text).then(done).catch(() => prompt('انسخ:', text));
            else prompt('انسخ:', text);
        }

        // إغلاق النوافذ بزر Esc أو بالضغط خارجها
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') { closeAddModal(); closeEditMsg(); closeLightbox(); }
        });
        document.addEventListener('click', e => {
            if (e.target.classList && e.target.classList.contains('modal-overlay')) e.target.style.display = 'none';
        });

        async function api(path, method = 'GET', body = null) {
            const opts = { method, headers: { 'Content-Type': 'application/json' } };
            if (currentUser && currentUser.token) opts.headers['X-Admin-Token'] = currentUser.token;
            if (body) opts.body = JSON.stringify(body);
            const res = await fetch(API_URL + path, opts);
            if (res.status === 401 && isAdmin()) {
                alert('انتهت صلاحية الدخول، سجّل الدخول من جديد');
                logout();
                throw new Error('unauthorized');
            }
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
        }

        function showToast(message, icon = '✅') {
            const toast = document.getElementById('toast-container');
            toast.innerHTML = `${icon} ${esc(message)}`;
            toast.classList.add('show');
            clearTimeout(showToast._t);
            showToast._t = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // ---------- الدخول وزر الرجوع للهاتف ----------
        window.addEventListener('popstate', function (event) {
            if (!currentUser) return;
            if (event.state && event.state.page === 'subject') {
                currentSubjectId = event.state.id;
                currentTab = 'subject_details';
            } else if (event.state && event.state.page === 'main') {
                currentTab = event.state.tab;
            } else {
                currentTab = 'subjects';
            }
            render();
        });

        function init() {
            const saved = localStorage.getItem('batchUser');
            if (saved) {
                try { currentUser = JSON.parse(saved); } catch (e) { currentUser = null; }
            }
            if (currentUser) {
                document.getElementById('main-header').style.display = 'flex';
                const rb = document.getElementById('role-badge');
                rb.textContent = isAdmin() ? '👨‍🏫 أدمن' : '';
                rb.style.display = isAdmin() ? 'inline-block' : 'none';

                // فتح نفس الصفحة بعد التحديث (مثلاً #subject-python أو #batch)
                goToHash(location.hash, false);
                startPolling();
            } else {
                document.getElementById('main-header').style.display = 'none';
                renderLogin();
            }
        }

        // ---------- التنبيهات بالمحتوى الجديد ----------
        // يتحقق الموقع كل دقيقة من وجود ملف أو تبليغ جديد ما دام مفتوحاً،
        // ويشغّل صوت التنبيه إذا فعّل الطالب الجرس 🔔
        const POLL_MS = 60 * 1000;
        let pollTimer = null;
        let alertTarget = null;
        let alertTimer = null;

        const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
        const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
        const soundOn = () => lsGet('soundOn') === '1';

        function updateBellUI() {
            const b = document.getElementById('bell-btn');
            if (!b) return;
            b.textContent = soundOn() ? '🔔' : '🔕';
            b.classList.toggle('on', soundOn());
            b.title = soundOn() ? 'التنبيهات الصوتية مفعّلة (اضغط للإيقاف)' : 'تفعيل التنبيهات الصوتية';
        }

        function playSound() {
            const a = document.getElementById('notify-sound');
            if (!a) return;
            try {
                a.currentTime = 0;
                const p = a.play();
                if (p && p.catch) p.catch(() => {});
            } catch (e) {}
        }

        async function toggleBell() {
            const on = !soundOn();
            lsSet('soundOn', on ? '1' : '0');
            updateBellUI();
            const card = document.getElementById('push-prompt');
            if (card) card.remove();
            if (on) {
                playSound(); // تجربة الصوت (وتسمح للتطبيق بتشغيله لاحقاً)
                const pushed = await enablePush(true);
                showToast(pushed ? 'تم تفعيل الإشعارات على جوالك' : 'تم تفعيل التنبيهات داخل التطبيق', '🔔');
            } else {
                await disablePush();
                showToast('تم إيقاف الإشعارات', '🔕');
            }
        }

        function showAlert(a) {
            alertTarget = a.target;
            document.getElementById('alert-icon').textContent = a.icon;
            document.getElementById('alert-title').textContent = a.title;
            document.getElementById('alert-body').textContent = a.body;
            const el = document.getElementById('alert-banner');
            el.classList.add('show');
            clearTimeout(alertTimer);
            alertTimer = setTimeout(hideAlert, 8000);
        }

        function hideAlert() { document.getElementById('alert-banner').classList.remove('show'); }

        function openAlertTarget() {
            hideAlert();
            const t = alertTarget;
            if (!t) return;
            if (t.page === 'batch') switchMainTab('batch');
            else if (t.page === 'subject') { openSubject(t.id); if (t.sub !== 'files') switchSubTab(t.sub); }
        }

        function systemNotify(a) {
            if (!('Notification' in window) || Notification.permission !== 'granted' || !document.hidden) return;
            try { new Notification(a.title, { body: a.body, tag: 'study-assistant' }); } catch (e) {}
        }

        function markMessagesViewed(id) {
            lsSet('viewed_msg', id);
            const dot = document.getElementById('batch-dot');
            if (dot) dot.style.display = 'none';
        }

        function updateBatchDot(latestMsgId) {
            const dot = document.getElementById('batch-dot');
            if (!dot) return;
            const viewed = parseInt(lsGet('viewed_msg')) || 0;
            dot.style.display = (latestMsgId > viewed && currentTab !== 'batch') ? 'block' : 'none';
        }

        // silent = تحديث المرجع بدون تنبيه (مثلاً بعد أن ينشر الأدمن بنفسه)
        async function checkForNew(silent = false) {
            if (!currentUser) return;
            let d;
            try { d = await api('/api/updates/latest'); } catch (e) { return; }
            const lec = d.lecture, msg = d.message;
            const prevLec = lsGet('notified_lec'), prevMsg = lsGet('notified_msg');
            const alerts = [];

            if (lec && prevLec !== null && lec.id > Number(prevLec)) {
                const sub = SUBJECTS.find(s => s.id === lec.subject_id);
                const isVid = String(lec.title).startsWith('[VIDEO]');
                alerts.push({
                    icon: isVid ? '🎬' : '📚',
                    title: isVid ? 'شرح جديد' + (sub ? ' في ' + sub.name : '') : 'ملف جديد' + (sub ? ' في ' + sub.name : ''),
                    body: String(lec.title).replace(/^\[(VIDEO|PDF)\]/, ''),
                    target: sub ? { page: 'subject', id: sub.id, sub: isVid ? 'videos' : 'files' } : null,
                });
            }
            if (msg && prevMsg !== null && msg.id > Number(prevMsg)) {
                alerts.push({ icon: '📣', title: 'تبليغ جديد للدفعة', body: msg.text || '🖼️ صورة جديدة', target: { page: 'batch' } });
            }

            lsSet('notified_lec', lec ? lec.id : 0);
            lsSet('notified_msg', msg ? msg.id : 0);
            updateBatchDot(msg ? msg.id : 0);

            if (silent || !alerts.length) return;
            const a = alerts[alerts.length - 1]; // التبليغ أولى من الملف إذا وصل الاثنان معاً
            showAlert(a);
            systemNotify(a);
            if (soundOn()) playSound();

            // تحديث الصفحة الحالية لتظهر المحتويات الجديدة
            if (currentTab === 'subjects') render();
            else if (currentTab === 'batch') fetchWeeklyMessages();
        }

        function startPolling() {
            updateBellUI();
            if (soundOn()) enablePush(false); // تجديد الاشتراك بصمت عند كل فتح
            if (pollTimer) return;
            checkForNew();
            pollTimer = setInterval(() => { if (!document.hidden) checkForNew(); }, POLL_MS);
            document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForNew(); });
        }

        // يفتح الصفحة المطلوبة من رابط مثل #subject-python أو #batch
        function goToHash(rawHash, push = true) {
            const hash = String(rawHash || '').replace(/^#/, '');
            const subMatch = hash.match(/^subject-(.+)$/);
            const save = push ? history.pushState.bind(history) : history.replaceState.bind(history);
            if (subMatch && SUBJECTS.some(s => s.id === subMatch[1])) {
                currentSubjectId = subMatch[1];
                currentTab = 'subject_details';
                activeSubTab = 'files';
                save({ page: 'subject', id: currentSubjectId }, '', '#' + hash);
            } else {
                currentTab = hash === 'batch' ? 'batch' : 'subjects';
                save({ page: 'main', tab: currentTab }, '', '#' + currentTab);
            }
            render();
        }

        // ---------- إشعارات الجوال (تصل حتى لو كان التطبيق مغلقاً) ----------
        const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;

        function b64ToBytes(b64) {
            const s = atob((b64 + '='.repeat((4 - b64.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/'));
            return Uint8Array.from(s, c => c.charCodeAt(0));
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
            // الضغط على إشعار والتطبيق مفتوح: ننتقل للصفحة المقصودة
            navigator.serviceWorker.addEventListener('message', e => {
                if (e.data && e.data.type === 'navigate' && currentUser) goToHash(e.data.hash);
            });
        }

        async function enablePush(interactive = true) {
            if (!pushSupported()) return false;
            let perm = Notification.permission;
            if (perm === 'default' && interactive) perm = await Notification.requestPermission();
            if (perm !== 'granted') {
                if (interactive) showToast('اسمح للتطبيق بالإشعارات من إعدادات الجوال', '⚠️');
                return false;
            }
            try {
                const { key } = await api('/api/push/key');
                if (!key) return false;
                const reg = await navigator.serviceWorker.ready;
                let sub = await reg.pushManager.getSubscription();
                if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(key) });
                await api('/api/push/subscribe', 'POST', sub.toJSON());
                return true;
            } catch (e) {
                if (interactive) showToast('تعذر تفعيل إشعارات الجوال', '❌');
                return false;
            }
        }

        async function disablePush() {
            if (!pushSupported()) return;
            try {
                const reg = await navigator.serviceWorker.ready;
                const sub = await reg.pushManager.getSubscription();
                if (sub) {
                    await api('/api/push/unsubscribe', 'POST', { endpoint: sub.endpoint }).catch(() => {});
                    await sub.unsubscribe();
                }
            } catch (e) {}
        }

        // بطاقة تدعو الطالب لتفعيل الإشعارات (تظهر مرة حتى يفعّلها أو يخفيها)
        function pushPromptHTML() {
            if (soundOn() || lsGet('pushPromptHidden') === '1') return '';
            if (pushSupported() && Notification.permission === 'denied') return '';
            return `
                <div class="push-prompt" id="push-prompt">
                    <div style="font-size: 30px;">🔔</div>
                    <div style="flex: 1;">
                        <div style="font-weight: 700;">فعّل الإشعارات</div>
                        <div style="color: var(--text-muted); font-size: 14px;">تصلك رسالة على جوالك فور نشر ملف أو شرح أو تبليغ جديد.</div>
                    </div>
                    <button class="btn" style="width: auto;" onclick="toggleBell()">تفعيل</button>
                    <button class="close-modal" title="إخفاء" onclick="lsSet('pushPromptHidden','1'); document.getElementById('push-prompt').remove();">&times;</button>
                </div>`;
        }

        function renderLogin() {
            document.getElementById('app-content').innerHTML = `
                <div class="login-wrapper card">
                    <div style="font-size: 50px; margin-bottom: 10px;">🎓</div>
                    <h2 style="margin-bottom: 20px;">مساعد دراسي</h2>

                    <input type="text" id="student-name" class="input-field" placeholder="اسمك (اختياري)" maxlength="40"
                           onkeydown="if(event.key==='Enter') studentLogin()">
                    <button class="btn" onclick="studentLogin()">دخول كطالب</button>

                    <hr style="border-color: var(--border); margin: 15px 0;">

                    <input type="password" id="login-pass" class="input-field" placeholder="كلمة مرور الأدمن" dir="ltr"
                           onkeydown="if(event.key==='Enter') adminLogin()">
                    <button class="btn btn-outline" onclick="adminLogin()">دخول كأدمن</button>
                </div>
            `;
        }

        function studentLogin() {
            const sn = (document.getElementById('student-name')?.value || '').trim().slice(0, 40);
            currentUser = { role: 'student', name: sn || 'طالب' };
            localStorage.setItem('batchUser', JSON.stringify(currentUser));
            init();
        }

        async function adminLogin() {
            const password = document.getElementById('login-pass').value;
            if (!password) return;
            try {
                const res = await fetch(API_URL + '/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                if (res.status === 401) return alert('كلمة المرور خاطئة');
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    return alert('خطأ في الخادم: ' + (err.error || res.status));
                }

                currentUser = await res.json();
                localStorage.setItem('batchUser', JSON.stringify(currentUser));
                init();
            } catch (e) {
                alert('تعذر الاتصال بالخادم');
            }
        }

        function logout() {
            localStorage.removeItem('batchUser');
            currentUser = null;
            history.replaceState(null, '', '/');
            init();
        }

        // ---------- التنقل ----------
        function switchMainTab(tab) {
            currentTab = tab;
            history.pushState({ page: 'main', tab: tab }, '', '#' + tab);
            render();
        }

        function render() {
            const app = document.getElementById('app-content');

            // تحديث لون الزر النشط في الأعلى (يعمل أيضاً عند زر الرجوع)
            const activeNav = currentTab === 'subject_details' ? 'subjects' : currentTab;
            document.querySelectorAll('.nav-btn[data-tab]').forEach(btn =>
                btn.classList.toggle('active', btn.dataset.tab === activeNav));

            // إعادة تشغيل الحركة في كل مرة يتم فيها التبديل
            app.classList.remove('fade-in');
            void app.offsetWidth;
            app.classList.add('fade-in');

            app.innerHTML = '';
            if (currentTab === 'subjects') renderSubjects(app);
            else if (currentTab === 'batch') renderBatch(app);
            else if (currentTab === 'subject_details') renderSubjectDetails(app);
        }

        function renderSubjects(app) {
            app.innerHTML = pushPromptHTML() + `<div class="grid-container">` + SUBJECTS.map(sub => `
                <div class="card subject-card" style="--accent: ${sub.color}; --accent-soft: ${sub.color}29; --accent-glow: ${sub.color}59;">
                    <span id="badge-${sub.id}" class="new-badge">جديد</span>
                    <span id="pend-${sub.id}" style="display: none; position: absolute; top: 10px; left: 10px; background: var(--warning); color: #0f172a; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 700;"></span>
                    <div class="subject-icon">${sub.icon}</div>
                    <div class="card-title" style="margin-bottom: 15px;">${sub.name}</div>
                    <div class="sub-count" id="count-${sub.id}">&nbsp;</div>
                    <button class="btn" onclick="openSubject('${sub.id}')">فتح المادة</button>
                </div>
            `).join('') + `</div>`;

            api('/api/updates/check').then(updates => {
                window.latestUpdates = updates;
                SUBJECTS.forEach(sub => {
                    const info = updates[sub.id] || {};
                    const storedMax = parseInt(localStorage.getItem(`max_id_${sub.id}`)) || 0;
                    const currentMax = info.max_id || 0;
                    const badge = document.getElementById(`badge-${sub.id}`);
                    if (badge && currentMax > storedMax) badge.style.display = 'inline-block';
                    const count = document.getElementById(`count-${sub.id}`);
                    if (count) {
                        const f = info.files || 0, v = info.videos || 0;
                        count.textContent = (f || v) ? `📖 ${f} ملف • ▶️ ${v} شرح` : 'لا يوجد محتوى بعد';
                    }
                });
            }).catch(() => console.log('فشل فحص التحديثات'));

            if (isAdmin()) {
                api('/api/admin/pending').then(p => {
                    SUBJECTS.forEach(sub => {
                        const el = document.getElementById(`pend-${sub.id}`);
                        const n = p[sub.id] || 0;
                        if (el && n > 0) { el.textContent = `❓ ${n} بانتظار الرد`; el.style.display = 'inline-block'; }
                    });
                }).catch(() => {});
            }
        }

        function renderBatch(app) {
            app.innerHTML = `
                <div class="card" style="text-align: center; margin-bottom: 20px; background: linear-gradient(145deg, var(--card-bg), var(--bg-color));">
                    <div style="font-size: 55px; margin-bottom: 10px;">🎓</div>
                    <div class="card-title" style="font-size: 24px; color: white;">علوم الذكاء الاصطناعي - المرحلة الثانية</div>
                    <div style="color: var(--text-muted); margin-top: 5px; font-size: 16px;">إشراف وإدارة: مهدي (ممثل الدفعة)</div>

                    <hr style="border-color: var(--border); margin: 20px 0;">
                    <p style="color: var(--text-muted); font-size: 15px; margin-bottom: 20px; line-height: 1.8;">
                        هذا النظام مخصص لتنظيم المحاضرات والأسئلة. جميع الشروحات والمواد تقدم للطلاب مجاناً ولا يتطلب النظام أي أكواد دعوة لتنزيل الملفات.
                    </p>

                    <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; margin-bottom: 25px;">
                        <a href="https://www.youtube.com/@guts4486/videos" target="_blank" rel="noopener" class="btn" style="background: #ef4444; color: white; width: auto; padding: 10px 25px;">قناة الشروحات</a>
                        <a href="https://t.me/+W0Dwz5CDcmEwNDNi" target="_blank" rel="noopener" class="btn" style="background: #2dd4bf; color: #0f172a; width: auto; padding: 10px 25px; font-weight: bold;">كروب المناقشة</a>
                        <a href="https://t.me/+vv2ot9xsKBE0NmZi" target="_blank" rel="noopener" class="btn" style="background: #14b8a6; color: white; width: auto; padding: 10px 25px;">قناة التبليغات</a>
                    </div>

                    <div style="background: var(--bg-color); border: 1px solid var(--border); border-radius: 8px; padding: 15px; text-align: center;">
                        ${[['احمد', 'ahmedh.almajidy@uokufa.edu.iq'], ['اسعد', 'asaad.alshareefi@uokufa.edu.iq']].map(([n, e]) => `
                            <div class="email-row">
                                إيميل الدكتور ${n}:
                                <a class="selectable" href="mailto:${e}">${e}</a>
                                <button class="act-icon" style="padding: 4px 8px;" title="نسخ الإيميل" onclick="copyText('${e}', 'تم نسخ الإيميل')">📋</button>
                            </div>`).join('')}
                    </div>
                </div>

                <div class="card">
                    <div class="card-title" style="color: var(--warning); margin-bottom: 15px;">📢 التوجيهات والرسائل الأسبوعية</div>
                    ${isAdmin() ? `
                        <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px;">
                            <textarea id="new-msg-input" class="input-field" rows="4" style="margin: 0; resize: vertical; min-height: 100px;" placeholder="اكتب التوجيه أو الرسالة لهذا الأسبوع..."></textarea>
                            <div class="uploader">
                                <input type="file" id="new-msg-files" accept="image/*" multiple hidden onchange="addPendingImages(this.files); this.value='';">
                                <button class="upload-btn" onclick="document.getElementById('new-msg-files').click()">📷 إضافة صور</button>
                                <div class="previews" id="msg-previews"></div>
                                <button class="btn btn-success" id="publish-msg-btn" style="width: 120px; margin-right: auto;" onclick="addWeeklyMessage()">نشر</button>
                            </div>
                        </div>
                    ` : ''}
                    <div id="messages-container">${skeleton(2)}</div>
                </div>
            `;
            renderPreviews();
            fetchWeeklyMessages();
        }

        function openSubject(id) {
            currentSubjectId = id;
            currentTab = 'subject_details';
            activeSubTab = 'files';

            const info = window.latestUpdates && window.latestUpdates[id];
            if (info && info.max_id) localStorage.setItem(`max_id_${id}`, info.max_id);
            // تسجيل خطوة جديدة ليتمكن الطالب من الرجوع منها
            history.pushState({ page: 'subject', id: id }, '', '#subject-' + id);
            render();
        }

        function renderSubjectDetails(app) {
            app.innerHTML = `
                <button class="btn btn-outline" style="width: auto; margin-bottom: 15px;" onclick="switchMainTab('subjects')">🔙 العودة للمواد</button>
                <div class="card">
                    <div class="sub-tabs">
                        <button class="sub-tab-btn ${activeSubTab === 'files' ? 'active' : ''}" onclick="switchSubTab('files')">📖 الملفات</button>
                        <button class="sub-tab-btn ${activeSubTab === 'videos' ? 'active' : ''}" onclick="switchSubTab('videos')">▶️ الشروحات</button>
                        <button class="sub-tab-btn ${activeSubTab === 'qa' ? 'active' : ''}" onclick="switchSubTab('qa')">❓ الأسئلة والمناقشة</button>
                    </div>
                    <div id="sub-view-container"></div>
                </div>
            `;
            if (activeSubTab === 'files') fetchMedia('files');
            else if (activeSubTab === 'videos') fetchMedia('videos');
            else fetchQA();
        }

        function switchSubTab(tab) {
            activeSubTab = tab;
            render();
        }

        // ---------- الملفات والشروحات ----------
        window.lectureMap = {};

        function linkKind(url, isVideo) {
            const u = String(url || '').toLowerCase();
            if (/youtube\.com|youtu\.be/.test(u)) return { icon: '▶️', label: 'يوتيوب', color: '#ef4444' };
            if (/drive\.google|docs\.google/.test(u)) return { icon: '📁', label: 'Google Drive', color: '#22c55e' };
            if (/t\.me|telegram/.test(u)) return { icon: '✈️', label: 'تلغرام', color: '#0ea5e9' };
            if (/\.pdf(\?|#|$)/.test(u)) return { icon: '📕', label: 'ملف PDF', color: '#3b82f6' };
            if (/\.(pptx?|docx?|xlsx?)(\?|#|$)/.test(u)) return { icon: '📝', label: 'مستند', color: '#8b5cf6' };
            return isVideo
                ? { icon: '🎬', label: 'فيديو', color: '#ef4444' }
                : { icon: '📄', label: 'ملف', color: '#3b82f6' };
        }

        function fmtTime(iso) {
            try { return new Date(iso).toLocaleString('ar-IQ', { dateStyle: 'short', timeStyle: 'short' }); }
            catch (e) { return ''; }
        }

        function fetchMedia(mediaType) {
            const container = document.getElementById('sub-view-container');
            container.innerHTML = skeleton(3);
            const isVid = mediaType === 'videos';

            api(`/api/lectures/${encodeURIComponent(currentSubjectId)}`)
            .then(data => {
                const isVideoTitle = t => String(t).startsWith('[VIDEO]');
                const list = (data || []).filter(item => isVid ? isVideoTitle(item.title) : !isVideoTitle(item.title));
                list.forEach(item => { window.lectureMap[item.id] = item; });

                const toolbar = isAdmin() ? `
                    <div class="toolbar">
                        <div class="toolbar-info">${isVid ? '🎬' : '📚'} ${list.length} ${isVid ? 'شرح فيديو' : 'ملف دراسي'}</div>
                        <button class="btn-add ${isVid ? 'btn-add-video' : 'btn-add-file'}" onclick="openAddModal('${isVid ? 'video' : 'pdf'}')">
                            ➕ ${isVid ? 'إضافة فيديو' : 'إضافة ملف'}
                        </button>
                    </div>` : '';

                const listBody = list.length === 0
                    ? `<div class="empty-state">${isVid ? '🎬 لا توجد شروحات فيديو حتى الآن.' : '📂 لا توجد ملفات دراسية حتى الآن.'}</div>`
                    : `<div id="sortable-list">${list.map(item => createItemHTML(item, isVid)).join('')}</div>
                       <div class="empty-state no-results" id="no-results">🔍 لا توجد نتائج مطابقة.</div>`;

                const search = list.length > 3 ? `
                    <div class="search-box">
                        <input type="search" class="input-field" placeholder="${isVid ? 'ابحث في الشروحات...' : 'ابحث في الملفات...'}" oninput="filterMedia(this.value)">
                    </div>` : '';

                container.innerHTML = toolbar + search + listBody;

                if (isAdmin() && list.length > 0 && window.Sortable) {
                    new Sortable(document.getElementById('sortable-list'), {
                        handle: '.drag-handle',
                        animation: 150,
                        ghostClass: 'sortable-ghost',
                        onEnd: function () {
                            const items = document.querySelectorAll('#sortable-list .media-item');
                            const order = Array.from(items).map((el, idx) => ({ id: Number(el.dataset.id), display_order: idx }));
                            api('/api/lectures/reorder', 'PUT', { order: order })
                            .catch(() => alert('تعذر حفظ الترتيب الجديد'));
                        }
                    });
                }
            })
            .catch(err => {
                container.innerHTML = `
                    ${isAdmin() ? `
                    <div class="toolbar">
                        <div class="toolbar-info">${isVid ? '🎬' : '📚'} تعذر تحميل القائمة</div>
                        <button class="btn-add ${isVid ? 'btn-add-video' : 'btn-add-file'}" onclick="openAddModal('${isVid ? 'video' : 'pdf'}')">
                            ➕ ${isVid ? 'إضافة فيديو' : 'إضافة ملف'}
                        </button>
                    </div>` : ''}
                    <div class="empty-state" style="color: red;">❌ فشل الاتصال بالخادم (${esc(err.message)}).</div>`;
            });
        }

        function filterMedia(q) {
            const needle = normAr(q.trim());
            let shown = 0;
            document.querySelectorAll('#sortable-list .media-item').forEach(el => {
                const match = !needle || el.dataset.search.includes(needle);
                el.style.display = match ? '' : 'none';
                if (match) shown++;
            });
            const nr = document.getElementById('no-results');
            if (nr) nr.style.display = shown ? 'none' : 'block';
        }

        function createItemHTML(item, isVid) {
            const kind = linkKind(item.file_url, isVid);
            const rawTitle = item.title.replace(/^\[(VIDEO|PDF)\]/, '');
            const title = esc(rawTitle);
            const id = Number(item.id);
            const yt = youtubeId(item.file_url);
            const icon = yt
                ? `<img class="media-thumb" src="https://i.ytimg.com/vi/${yt}/mqdefault.jpg" alt="" loading="lazy">`
                : `<div class="media-icon" style="background: ${kind.color}22; color: ${kind.color};">${kind.icon}</div>`;
            return `
                <div class="media-item" data-id="${id}" data-search="${esc(normAr(rawTitle))}">
                    ${isAdmin() ? `<div class="drag-handle" title="اسحب لتغيير الترتيب">↕️</div>` : ''}
                    ${icon}
                    <div class="media-info">
                        <div class="media-title">${title}</div>
                        <div class="media-meta">${kind.label}</div>
                    </div>
                    <div class="media-actions">
                        <a class="act-open" style="background: ${kind.color};" href="${esc(safeUrl(item.file_url))}" target="_blank" rel="noopener noreferrer">
                            ${isVid ? '▶️ مشاهدة' : '📖 فتح'}
                        </a>
                        <button class="act-icon" title="نسخ الرابط" onclick="copyLink(${id})">📋</button>
                        ${isAdmin() ? `
                            <button class="act-icon" title="تعديل العنوان" onclick="editLecture(${id})">✏️</button>
                            <button class="btn-delete" title="حذف" onclick="deleteLecture(${id})">🗑️</button>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        function copyLink(id) {
            const item = window.lectureMap[id];
            if (item) copyText(item.file_url, 'تم نسخ الرابط بنجاح');
        }

        function editLecture(id) {
            const item = window.lectureMap[id];
            if (!item) return;
            const prefix = (item.title.match(/^\[(VIDEO|PDF)\]/) || [''])[0];
            const current = item.title.slice(prefix.length);
            const next = prompt('عنوان جديد:', current);
            if (next === null || !next.trim()) return;
            api(`/api/lectures/${id}`, 'PUT', { title: prefix + next.trim() })
            .then(() => fetchMedia(activeSubTab))
            .catch(() => alert('تعذر التعديل'));
        }

        function openAddModal(type) {
            document.getElementById('addModal').style.display = 'flex';
            document.getElementById('modal-type').value = type;
            document.getElementById('modal-title').innerText = type === 'pdf' ? '📖 إضافة ملف دراسي' : '▶️ إضافة شرح فيديو';
            document.getElementById('modal-title-input').value = '';
            document.getElementById('modal-url-input').value = '';
            document.getElementById('save-btn').style.background = type === 'pdf' ? 'var(--primary)' : 'var(--danger)';
            setTimeout(() => document.getElementById('modal-title-input').focus(), 50);
        }

        function closeAddModal() { document.getElementById('addModal').style.display = 'none'; }

        function submitContent() {
            const title = document.getElementById('modal-title-input').value.trim();
            const url = document.getElementById('modal-url-input').value.trim();
            const type = document.getElementById('modal-type').value;

            if (!title || !url) return alert('يرجى ملء جميع الحقول');
            if (!/^https?:\/\//i.test(url)) return alert('الرابط يجب أن يبدأ بـ http:// أو https://');

            const finalTitle = type === 'video' ? `[VIDEO]${title}` : `[PDF]${title}`;
            const btn = document.getElementById('save-btn');
            btn.innerText = 'جاري الحفظ...'; btn.disabled = true;

            api('/api/lectures/add', 'POST', { subject_id: currentSubjectId, title: finalTitle, file_url: url, type })
            .then(() => { closeAddModal(); fetchMedia(type === 'pdf' ? 'files' : 'videos'); checkForNew(true); })
            .catch(() => alert('خطأ في الإضافة'))
            .finally(() => { btn.innerText = 'حفظ ونشر'; btn.disabled = false; });
        }

        function deleteLecture(id) {
            if (!confirm('هل أنت متأكد من الحذف النهائي؟')) return;
            api(`/api/lectures/${id}`, 'DELETE').then(() => fetchMedia(activeSubTab)).catch(() => alert('تعذر الحذف'));
        }

        // ---------- الأسئلة والمراسلة ----------
        function fetchQA() {
            const container = document.getElementById('sub-view-container');
            const admin = isAdmin();
            container.innerHTML = `
                <div class="qa-compose ${admin ? 'qa-compose-admin' : ''}">
                    <div class="qa-compose-title">${admin ? '📢 أرسل رسالة للطلاب في هذه المادة' : '❓ اطرح سؤالاً'}</div>
                    <textarea id="new-q-text" class="input-field" rows="3" maxlength="1000"
                        placeholder="${admin ? 'اكتب رسالة أو توجيه لطلاب هذه المادة...' : 'لديك سؤال حول المادة؟ اكتبه هنا...'}"></textarea>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn ${admin ? 'btn-success' : ''}" id="ask-btn" onclick="askQuestion()">${admin ? '📢 نشر الرسالة' : '✉️ إرسال السؤال'}</button>
                        <button class="btn btn-outline" style="width: auto;" onclick="loadQAList()">🔄 تحديث</button>
                    </div>
                </div>
                <div id="qa-list">${skeleton(2)}</div>
            `;
            loadQAList();
        }

        // يحدّث قائمة المحادثات فقط (بدون مسح ما يكتبه المستخدم في خانة السؤال)
        function loadQAList() {
            api(`/api/questions/${encodeURIComponent(currentSubjectId)}`)
            .then(data => {
                const qaList = document.getElementById('qa-list');
                if (!qaList) return;
                if (!data || data.length === 0) {
                    qaList.innerHTML = '<div class="empty-state">💬 لا توجد محادثات في هذه المادة بعد.</div>';
                    return;
                }
                qaList.innerHTML = data.map(threadHTML).join('');
            })
            .catch(() => {
                const el = document.getElementById('qa-list');
                if (el) el.innerHTML = '<div class="empty-state" style="color: red;">❌ فشل جلب المحادثات.</div>';
            });
        }

        function replyHTML(r) {
            return `
                <div class="reply ${r.is_admin ? 'reply-admin' : 'reply-student'}">
                    <div class="who">
                        ${r.is_admin ? '👨‍🏫' : '🧑‍🎓'} <b>${esc(r.author)}</b>
                        <span class="when">${fmtTime(r.created_at)}</span>
                        ${isAdmin() ? `<button class="mini-del" title="حذف الرد" onclick="deleteReply(${Number(r.id)})">🗑️</button>` : ''}
                    </div>
                    <div>${linkify(r.text)}</div>
                </div>
            `;
        }

        function threadHTML(q) {
            const admin = isAdmin();
            const replies = q.replies || [];
            const answered = !!q.a_text || replies.some(r => r.is_admin);
            const chip = q.is_admin ? '' : (answered ? '<span class="chip chip-ok">✅ تمت الإجابة</span>' : '<span class="chip chip-wait">⏳ بانتظار الإجابة</span>');
            return `
                <div class="thread ${q.is_admin ? 'thread-admin' : ''}">
                    <div class="thread-head">
                        <div class="who">
                            ${q.is_admin ? '👨‍🏫' : '🧑‍🎓'} <b>${esc(q.asker || (q.is_admin ? 'الأدمن' : 'طالب'))}</b>
                            ${q.is_admin ? '<span class="chip chip-admin">📢 رسالة من الأدمن</span>' : ''}
                            <span class="when">${fmtTime(q.created_at)}</span>
                        </div>
                        <div style="display: flex; gap: 8px; align-items: center;">
                            ${chip}
                            ${admin ? `<button class="btn-delete" title="حذف المحادثة" onclick="deleteQuestion(${Number(q.id)})">🗑️</button>` : ''}
                        </div>
                    </div>
                    <div class="thread-text">${linkify(q.q_text)}</div>
                    ${q.a_text ? `<div class="reply reply-admin"><div class="who">👨‍🏫 <b>الأدمن</b></div><div>${linkify(q.a_text)}</div></div>` : ''}
                    ${replies.map(replyHTML).join('')}
                    <div class="reply-box">
                        <input type="text" id="reply-${q.id}" class="input-field" maxlength="2000"
                               placeholder="${admin ? 'اكتب ردك على الطلاب...' : 'اكتب رداً...'}"
                               onkeydown="if(event.key==='Enter') sendReply(${Number(q.id)})">
                        <button class="btn ${admin ? 'btn-success' : ''}" id="reply-btn-${Number(q.id)}" style="width: auto;" onclick="sendReply(${Number(q.id)})">${admin ? '👨‍🏫 رد' : '↩️ رد'}</button>
                    </div>
                </div>
            `;
        }

        function askQuestion() {
            const input = document.getElementById('new-q-text');
            const btn = document.getElementById('ask-btn');
            const text = input.value.trim();
            if (!text) return showToast('اكتب سؤالك أولاً', '⚠️');
            if (btn.disabled) return;
            btn.disabled = true;
            api('/api/questions/add', 'POST', { subject_id: currentSubjectId, q_text: text, asker: currentUser.name })
            .then(() => { input.value = ''; showToast(isAdmin() ? 'تم نشر الرسالة' : 'تم إرسال سؤالك'); loadQAList(); })
            .catch(() => showToast('تعذر الإرسال', '❌'))
            .finally(() => { btn.disabled = false; });
        }

        function sendReply(qId) {
            const input = document.getElementById(`reply-${qId}`);
            const btn = document.getElementById(`reply-btn-${qId}`);
            const text = input.value.trim();
            if (!text || (btn && btn.disabled)) return;
            if (btn) btn.disabled = true;
            api(`/api/questions/${qId}/reply`, 'POST', { text, author: currentUser.name })
            .then(() => { showToast('تم إرسال الرد'); loadQAList(); })
            .catch(() => { showToast('تعذر إرسال الرد', '❌'); if (btn) btn.disabled = false; });
        }

        function deleteQuestion(id) { if (confirm('حذف المحادثة؟')) api(`/api/questions/${id}`, 'DELETE').then(() => loadQAList()).catch(() => showToast('تعذر الحذف', '❌')); }
        function deleteReply(id) { if (confirm('حذف الرد؟')) api(`/api/replies/${id}`, 'DELETE').then(() => loadQAList()).catch(() => showToast('تعذر الحذف', '❌')); }

        // ---------- الرسائل الأسبوعية ----------
        function fetchWeeklyMessages() {
            const container = document.getElementById('messages-container');
            if (!container) return;
            api('/api/messages').then(msgs => {
                window.weeklyMessages = msgs || [];
                if (window.weeklyMessages.length === 0) {
                    container.innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 20px; border: 1px dashed var(--border); border-radius: 8px;">لا توجد رسائل أسبوعية حتى الآن.</div>';
                    return;
                }
                markMessagesViewed(window.weeklyMessages[0].id);
                container.innerHTML = window.weeklyMessages.map((msg, index) => `
                    <div class="week-msg ${index === 0 ? 'latest' : ''}">
                        <div class="week-msg-head">
                            <div class="week-msg-date">
                                <span class="week-chip">${index === 0 ? '🆕 الأحدث' : 'الأسبوع ' + (window.weeklyMessages.length - index)}</span>
                                ${esc(msg.date)}
                            </div>
                            ${isAdmin() ? `
                                <div class="week-msg-actions">
                                    <button onclick="editMessage(${Number(msg.id)})" style="color: var(--primary);">تعديل ✏️</button>
                                    <button onclick="deleteMessage(${Number(msg.id)})" style="color: var(--danger);">حذف 🗑️</button>
                                </div>
                            ` : ''}
                        </div>
                        ${msg.text ? `<div class="week-msg-text">${linkify(msg.text)}</div>` : ''}
                        ${galleryHTML(msg)}
                    </div>
                `).join('');
            }).catch(() => {
                container.innerHTML = '<div class="empty-state" style="color: red;">❌ فشل جلب الرسائل.</div>';
            });
        }

        // ---------- صور الرسالة الأسبوعية ----------
        const MAX_IMAGES = 6;
        let pendingImages = [];

        function galleryHTML(msg) {
            const srcs = (msg.image_ids || []).map(id => `/api/images/${Number(id)}`);
            if (msg.image_url && safeUrl(msg.image_url) !== '#') srcs.push(msg.image_url);
            if (!srcs.length) return '';
            return `<div class="gallery n${Math.min(srcs.length, 6)}">` + srcs.map(s =>
                `<img src="${esc(s)}" loading="lazy" alt="صورة مرفقة" onclick="openLightbox(this.src)">`).join('') + '</div>';
        }

        function openLightbox(src) {
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox').classList.add('show');
        }
        function closeLightbox() { document.getElementById('lightbox').classList.remove('show'); }

        // تصغير الصورة وضغطها في المتصفح قبل الرفع (أسرع وأوفر للإنترنت)
        function compressImage(file, maxSide = 1400, quality = 0.72) {
            return new Promise((resolve, reject) => {
                const url = URL.createObjectURL(file);
                const img = new Image();
                img.onload = () => {
                    const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.round(img.width * scale);
                    canvas.height = Math.round(img.height * scale);
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    URL.revokeObjectURL(url);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('bad image')); };
                img.src = url;
            });
        }

        async function addPendingImages(files) {
            const list = Array.from(files || []).filter(f => f.type.startsWith('image/'));
            for (const f of list) {
                if (pendingImages.length >= MAX_IMAGES) { showToast(`الحد الأقصى ${MAX_IMAGES} صور`, '⚠️'); break; }
                try { pendingImages.push(await compressImage(f)); }
                catch (e) { showToast('تعذر قراءة إحدى الصور', '❌'); }
            }
            renderPreviews();
        }

        function removePendingImage(i) { pendingImages.splice(i, 1); renderPreviews(); }

        function renderPreviews() {
            const box = document.getElementById('msg-previews');
            if (!box) return;
            box.innerHTML = pendingImages.map((src, i) => `
                <div class="preview"><img src="${src}" alt=""><button onclick="removePendingImage(${i})" title="إزالة">&times;</button></div>
            `).join('');
        }

        function addWeeklyMessage() {
            const input = document.getElementById('new-msg-input');
            const btn = document.getElementById('publish-msg-btn');
            const text = input.value.trim();

            if (!text && !pendingImages.length) return showToast('اكتب نصاً أو أضف صورة', '⚠️');

            btn.disabled = true;
            btn.innerText = pendingImages.length ? 'جاري الرفع...' : 'جاري النشر...';
            api('/api/messages/add', 'POST', { text, images: pendingImages, date: new Date().toLocaleDateString('ar-IQ') })
            .then(() => {
                input.value = '';
                pendingImages = [];
                renderPreviews();
                showToast('تم نشر الرسالة');
                fetchWeeklyMessages();
                checkForNew(true);
            })
            .catch(() => showToast('تعذر نشر الرسالة', '❌'))
            .finally(() => { btn.disabled = false; btn.innerText = 'نشر'; });
        }

        function editMessage(id) {
            const msg = (window.weeklyMessages || []).find(m => Number(m.id) === Number(id));
            if (!msg) return;
            document.getElementById('edit-msg-id').value = id;
            document.getElementById('edit-msg-text').value = msg.text || '';
            document.getElementById('editMsgModal').style.display = 'flex';
        }

        function closeEditMsg() {
            document.getElementById('editMsgModal').style.display = 'none';
        }

        function saveEditedMessage() {
            const id = Number(document.getElementById('edit-msg-id').value);
            const text = document.getElementById('edit-msg-text').value.trim();
            const msg = (window.weeklyMessages || []).find(m => Number(m.id) === id);

            if (!text && !(msg && msg.image_url)) return showToast('الرسالة فارغة', '⚠️');

            const btn = document.getElementById('edit-msg-save');
            btn.disabled = true;
            api(`/api/messages/${id}`, 'PUT', { text })
            .then(() => {
                closeEditMsg();
                showToast('تم تعديل الرسالة بنجاح');
                fetchWeeklyMessages();
            })
            .catch(() => showToast('تعذر التعديل', '❌'))
            .finally(() => { btn.disabled = false; });
        }

        function deleteMessage(id) {
            if (confirm('حذف الرسالة؟')) {
                api(`/api/messages/${id}`, 'DELETE')
                .then(() => fetchWeeklyMessages())
                .catch(() => showToast('تعذر الحذف', '❌'));
            }
        }

        init();
    </script>
</body>
</html>
