<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0f1e">
    <meta name="description" content="مساعد دراسي لطلاب علوم الذكاء الاصطناعي - المرحلة الثانية: ملفات، شروحات، أسئلة وتبليغات الدفعة.">
    <link rel="icon" href="/icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <title>مساعد دراسي | الذكاء الاصطناعي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <style>
        /* =========================================================
           نظام التصميم
           ========================================================= */
        :root {
            --bg-color: #0a0f1e;
            --bg-2: #0e1528;
            --card-bg: rgba(20, 28, 50, 0.72);
            --card-solid: #141c32;
            --item-bg: rgba(255, 255, 255, 0.035);
            --item-hover: rgba(255, 255, 255, 0.06);
            --text-main: #eef2ff;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --primary: #4f8cff;
            --primary-hover: #3b7bff;
            --violet: #8b5cf6;
            --grad: linear-gradient(135deg, #4f8cff 0%, #7c5cff 100%);
            --danger: #f43f5e;
            --danger-hover: #e11d48;
            --success: #10b981;
            --warning: #f59e0b;
            --border: rgba(148, 163, 184, 0.14);
            --border-strong: rgba(148, 163, 184, 0.26);
            --shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 18px 40px -18px rgba(0, 0, 0, 0.6);
            --radius: 18px;
            --radius-sm: 12px;
            --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
            --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'IBM Plex Sans Arabic', 'Tajawal', system-ui, sans-serif; }
        * { -webkit-tap-highlight-color: transparent; } /* يمنع الوميض الأزرق عند لمس الأزرار */

        html { scroll-behavior: smooth; }
        body {
            background: var(--bg-color);
            color: var(--text-main);
            line-height: 1.65;
            min-height: 100vh;
            overflow-x: hidden;
            overscroll-behavior-y: none; /* يمنع التحديث عند سحب الشاشة للأسفل */
            -webkit-user-select: none; /* يمنع تحديد النصوص عند الضغط المطول بالخطأ */
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        /* استثناء حقول الإدخال والنصوص ليتمكن الطلاب من الكتابة والنسخ */
        .input-field, textarea, input, .selectable, .thread-text, .reply, .week-msg-text {
            -webkit-user-select: auto;
            user-select: auto;
        }

        /* ---- الخلفية المتحركة (هالات ضوئية ناعمة) ---- */
        .aurora { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
        .aurora::after { /* شبكة نقاط خفيفة */
            content: ''; position: absolute; inset: 0;
            background-image: radial-gradient(rgba(148,163,184,0.09) 1px, transparent 1px);
            background-size: 26px 26px;
            mask-image: radial-gradient(ellipse at 50% 0%, #000 0%, transparent 70%);
            -webkit-mask-image: radial-gradient(ellipse at 50% 0%, #000 0%, transparent 70%);
        }
        .aurora span { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.5; will-change: transform; }
        .aurora span:nth-child(1) { width: 520px; height: 520px; background: #2563eb; top: -220px; right: -120px; animation: drift1 22s ease-in-out infinite alternate; }
        .aurora span:nth-child(2) { width: 460px; height: 460px; background: #7c3aed; top: 30%; left: -200px; opacity: 0.35; animation: drift2 26s ease-in-out infinite alternate; }
        .aurora span:nth-child(3) { width: 380px; height: 380px; background: #0891b2; bottom: -200px; right: 20%; opacity: 0.28; animation: drift3 30s ease-in-out infinite alternate; }
        @keyframes drift1 { to { transform: translate(-140px, 120px) scale(1.15); } }
        @keyframes drift2 { to { transform: translate(160px, -80px) scale(0.9); } }
        @keyframes drift3 { to { transform: translate(-120px, -140px) scale(1.2); } }

        /* =========================================================
           الشريط العلوي والتنقل
           ========================================================= */
        header {
            position: sticky; top: 0; z-index: 100;
            display: flex; justify-content: space-between; align-items: center; gap: 16px;
            padding: 12px 24px;
            background: rgba(10, 15, 30, 0.66);
            backdrop-filter: blur(18px) saturate(160%);
            -webkit-backdrop-filter: blur(18px) saturate(160%);
            border-bottom: 1px solid var(--border);
            animation: slideDown 0.6s var(--ease) both;
        }
        @keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } }

        .logo { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 700; letter-spacing: -0.2px; }
        .logo img { width: 36px; height: 36px; border-radius: 10px; box-shadow: 0 6px 18px -6px rgba(79,140,255,0.7); }
        .logo-text { background: linear-gradient(90deg, #fff, #c7d2fe); -webkit-background-clip: text; background-clip: text; color: transparent; }

        nav { position: relative; display: flex; gap: 4px; padding: 4px; border-radius: 14px;
            background: rgba(255,255,255,0.04); border: 1px solid var(--border); }
        .nav-indicator { position: absolute; top: 4px; bottom: 4px; right: 0; width: 0; border-radius: 10px;
            background: var(--grad); box-shadow: 0 6px 20px -6px rgba(79,140,255,0.8);
            transition: transform 0.45s var(--ease), width 0.45s var(--ease); z-index: 0; }
        .nav-btn {
            position: relative; z-index: 1; display: flex; align-items: center; gap: 7px;
            background: transparent; border: none; color: var(--text-muted);
            padding: 8px 14px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 14px;
            transition: color 0.3s var(--ease), background 0.3s;
        }
        .nav-btn:hover { color: var(--text-main); }
        .nav-btn.active { color: #fff; }
        .nav-ico { position: relative; font-size: 16px; line-height: 1; }
        .nav-logout { color: #fda4af; }
        .nav-logout:hover { color: #fb7185; background: rgba(244,63,94,0.08); }
        .bell-btn.on .nav-ico { animation: ring 1.2s var(--ease) 1; }
        .bell-btn.on { color: #fcd34d; }
        .music-btn.on { color: #c4b5fd; }
        #sound-menu { position: fixed; z-index: 400; width: 270px; padding: 8px; border-radius: 18px;
            background: rgba(15,22,42,0.97); border: 1px solid var(--border); box-shadow: 0 22px 50px -15px rgba(0,0,0,0.75);
            opacity: 0; transform: translateY(6px) scale(0.97); pointer-events: none; transition: opacity 0.2s, transform 0.25s var(--ease); }
        #sound-menu.show { opacity: 1; transform: none; pointer-events: auto; }
        .snd-row { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 12px; cursor: pointer; transition: background 0.2s; }
        .snd-row:hover { background: rgba(255,255,255,0.05); }
        .snd-row span { flex: 1; display: flex; flex-direction: column; gap: 2px; }
        .snd-row small { color: var(--text-muted); font-size: 12px; }
        .snd-row input { position: absolute; opacity: 0; pointer-events: none; }
        .sw { flex: none; position: relative; width: 44px; height: 25px; border-radius: 999px; background: rgba(255,255,255,0.14); transition: background 0.25s; }
        .sw::after { content: ''; position: absolute; top: 3px; right: 3px; width: 19px; height: 19px; border-radius: 50%; background: #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.35); transition: transform 0.25s var(--ease); }
        .snd-row input:checked + .sw { background: var(--primary); }
        .snd-row input:checked + .sw::after { transform: translateX(-19px); }
        @keyframes ring { 0%,100% { transform: rotate(0); } 15% { transform: rotate(18deg); } 30% { transform: rotate(-14deg); } 45% { transform: rotate(9deg); } 60% { transform: rotate(-5deg); } }
        .nav-dot { display: none; position: absolute; top: -3px; left: -5px; width: 9px; height: 9px; border-radius: 50%;
            background: var(--danger); box-shadow: 0 0 0 2px var(--bg-color); animation: dotPulse 2s infinite; }
        @keyframes dotPulse { 0%,100% { box-shadow: 0 0 0 2px var(--bg-color), 0 0 0 2px rgba(244,63,94,0.6); } 50% { box-shadow: 0 0 0 2px var(--bg-color), 0 0 0 7px rgba(244,63,94,0); } }

        .role-badge { font-size: 11px; font-weight: 700; background: rgba(245,158,11,0.14); color: #fcd34d;
            padding: 3px 10px; border-radius: 999px; border: 1px solid rgba(245,158,11,0.3); }

        main { max-width: 1040px; margin: 32px auto 60px; padding: 0 24px; }

        /* =========================================================
           العناصر الأساسية
           ========================================================= */
        .card {
            position: relative;
            background: var(--card-bg);
            backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--border); border-radius: var(--radius);
            padding: 22px; display: flex; flex-direction: column; gap: 10px;
            box-shadow: var(--shadow);
            transition: transform 0.45s var(--ease), box-shadow 0.45s var(--ease), border-color 0.3s;
        }
        .card-title { font-size: 18px; font-weight: 700; color: var(--text-main); letter-spacing: -0.2px; }

        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 20px; align-items: stretch; }

        .input-field {
            width: 100%; padding: 12px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong);
            background: rgba(2, 6, 23, 0.45); color: var(--text-main); margin-bottom: 10px; font-size: 15px; outline: none;
            transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
        }
        .input-field::placeholder { color: var(--text-dim); }
        .input-field:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(79,140,255,0.15); background: rgba(2,6,23,0.6); }

        .btn {
            position: relative; overflow: hidden;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center;
            background: var(--grad); color: #fff;
            padding: 11px 18px; border-radius: var(--radius-sm); text-decoration: none; border: none;
            cursor: pointer; font-weight: 600; font-size: 15px; width: 100%; white-space: nowrap;
            box-shadow: 0 8px 20px -10px rgba(79,140,255,0.8);
            transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease), filter 0.25s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 14px 28px -12px rgba(79,140,255,0.9); filter: brightness(1.06); }
        .btn:disabled { opacity: 0.6; cursor: wait; transform: none; }
        .btn-danger { background: linear-gradient(135deg, #f43f5e, #e11d48); box-shadow: 0 8px 20px -10px rgba(244,63,94,0.8); }
        .btn-success { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 8px 20px -10px rgba(16,185,129,0.8); }
        .btn-outline { background: rgba(255,255,255,0.04); border: 1px solid var(--border-strong); color: var(--text-main); box-shadow: none; }
        .btn-outline:hover { background: rgba(255,255,255,0.08); box-shadow: none; }
        .btn-delete { position: relative; overflow: hidden; background: transparent; border: 1px solid rgba(244,63,94,0.4); color: var(--danger);
            padding: 8px 11px; border-radius: 10px; cursor: pointer; transition: 0.25s var(--ease); }
        .btn-delete:hover { background: var(--danger); color: #fff; border-color: var(--danger); }

        .btn:active, .nav-btn:active, .act-open:active, .act-icon:active, .sub-tab-btn:active, .btn-add:active, .upload-btn:active {
            transform: scale(0.96); /* انكماش الزر عند اللمس */
            transition: transform 0.1s ease;
        }

        /* تموّج عند الضغط */
        .ripple { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.35); transform: scale(0);
            pointer-events: none; animation: ripple 0.6s ease-out forwards; }
        @keyframes ripple { to { transform: scale(2.6); opacity: 0; } }

        .empty-state { text-align: center; padding: 44px 20px; color: var(--text-muted); border: 1.5px dashed var(--border-strong);
            border-radius: var(--radius); background: rgba(255,255,255,0.02); }
        .admin-panel { background: rgba(79,140,255,0.05); border: 1px dashed var(--primary); border-radius: var(--radius); padding: 20px; margin-top: 20px; }

        /* =========================================================
           شاشة الدخول
           ========================================================= */
        .login-wrapper { max-width: 420px; margin: 9vh auto 40px; text-align: center; padding: 34px 28px; gap: 14px; }
        .login-logo { width: 88px; height: 88px; margin: 0 auto 6px; border-radius: 26px;
            box-shadow: 0 20px 50px -14px rgba(79,140,255,0.8); animation: floaty 4s ease-in-out infinite; }
        @keyframes floaty { 50% { transform: translateY(-8px); } }
        .login-title { font-size: 28px; font-weight: 700; background: linear-gradient(90deg, #fff, #a5b4fc); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .login-sub { color: var(--text-muted); font-size: 14px; margin-top: -6px; margin-bottom: 8px; }
        .admin-login { margin-top: 6px; text-align: right; }
        .admin-login summary { cursor: pointer; color: var(--text-muted); font-size: 14px; list-style: none; text-align: center; padding: 6px; transition: color 0.2s; }
        .admin-login summary::-webkit-details-marker { display: none; }
        .admin-login summary:hover { color: var(--text-main); }
        .admin-login[open] summary { color: var(--text-main); margin-bottom: 10px; }
        .admin-login[open] > div { animation: rise 0.4s var(--ease) both; }
        .divider { display: flex; align-items: center; gap: 12px; color: var(--text-dim); font-size: 12px; margin: 4px 0; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

        /* =========================================================
           الصفحة الرئيسية
           ========================================================= */
        .hero { overflow: hidden; padding: 26px 26px 22px; margin-bottom: 22px;
            background: linear-gradient(135deg, rgba(79,140,255,0.16), rgba(124,92,255,0.10) 55%, rgba(20,28,50,0.7)); }
        .hero::before { content: ''; position: absolute; width: 260px; height: 260px; border-radius: 50%; left: -80px; top: -120px;
            background: radial-gradient(circle, rgba(124,92,255,0.45), transparent 70%); filter: blur(10px); animation: floaty 7s ease-in-out infinite; }
        .hero-top { position: relative; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
        .hero-greet { font-size: 26px; font-weight: 700; letter-spacing: -0.3px; }
        .hero-greet .wave { display: inline-block; transform-origin: 70% 70%; animation: wave 2.4s ease-in-out 0.6s 2; }
        @keyframes wave { 0%,60%,100% { transform: rotate(0); } 10%,30% { transform: rotate(14deg); } 20% { transform: rotate(-8deg); } 40% { transform: rotate(-4deg); } 50% { transform: rotate(10deg); } }
        .hero-date { color: var(--text-muted); font-size: 14px; margin-top: 2px; }
        .stats { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 20px; }
        .stat { background: rgba(2,6,23,0.35); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; }
        .stat-num { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
        .stat-label { color: var(--text-muted); font-size: 12px; }

        .section-title { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; color: var(--text-muted); margin: 6px 4px 14px; }
        .section-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border), transparent); }

        /* بطاقة المادة: إضاءة تتبع المؤشر + ميلان خفيف */
        .subject-card { text-align: center; cursor: pointer; overflow: hidden; padding-top: 26px; --rx: 0deg; --ry: 0deg; }
        .subject-card::before { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0;
            background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 0%), var(--accent-soft), transparent 45%);
            transition: opacity 0.4s; }
        .subject-card::after { content: ''; position: absolute; top: 0; left: 18%; right: 18%; height: 2px; border-radius: 2px;
            background: var(--accent); box-shadow: 0 0 18px 2px var(--accent); opacity: 0.85; }
        .subject-card:hover { transform: perspective(900px) rotateX(var(--rx)) rotateY(var(--ry)) translateY(-6px);
            border-color: var(--accent-glow); box-shadow: 0 24px 50px -22px var(--accent-glow), var(--shadow); }
        .subject-card:hover::before { opacity: 1; }
        .subject-icon { position: relative; width: 78px; height: 78px; margin: 0 auto 14px; border-radius: 24px; display: flex; align-items: center;
            justify-content: center; font-size: 40px; background: var(--accent-soft); border: 1px solid var(--accent-glow);
            transition: transform 0.5s var(--spring); }
        .subject-card:hover .subject-icon { transform: translateY(-4px) scale(1.08) rotate(-4deg); }
        .subject-card .card-title { position: relative; }
        .subject-card .btn { margin-top: auto; background: var(--accent); box-shadow: 0 10px 22px -12px var(--accent); }
        .subject-card .btn .arrow { display: inline-block; transition: transform 0.35s var(--ease); }
        .subject-card:hover .btn .arrow { transform: translateX(-5px); }
        .sub-count { position: relative; color: var(--text-muted); font-size: 13px; margin: -6px 0 14px; min-height: 22px; }
        .new-badge { display: none; position: absolute; top: 12px; right: 12px; z-index: 2; background: var(--danger); color: #fff;
            padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; animation: badgePulse 2s infinite; }
        @keyframes badgePulse { 0%,100% { box-shadow: 0 0 0 0 rgba(244,63,94,0.55); } 50% { box-shadow: 0 0 0 7px rgba(244,63,94,0); } }
        .pend-badge { display: none; position: absolute; top: 12px; left: 12px; z-index: 2; background: var(--warning); color: #0a0f1e;
            padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }

        .push-prompt { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; padding: 14px 16px;
            background: linear-gradient(135deg, rgba(245,158,11,0.12), rgba(245,158,11,0.04)); border: 1px solid rgba(245,158,11,0.35); border-radius: var(--radius); }
        .push-prompt .bell-ico { font-size: 28px; animation: ring 2.4s var(--ease) 1s infinite; }
        .install-prompt { background: linear-gradient(135deg, rgba(79,140,255,0.16), rgba(45,212,191,0.06)); border-color: rgba(79,140,255,0.4); }
        .install-prompt .app-ico { width: 46px; height: 46px; border-radius: 14px; box-shadow: 0 8px 20px -8px rgba(79,140,255,0.7); }
        .install-steps { list-style: none; padding: 0; margin: 4px 0 16px; counter-reset: st; }
        .install-steps li { counter-increment: st; display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px dashed var(--border); line-height: 1.8; color: var(--text-muted); }
        .install-steps li:last-child { border-bottom: none; }
        .install-steps li::before { content: counter(st); flex: none; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            background: var(--primary); color: #fff; font-weight: 700; font-size: 14px; }
        .install-steps b { color: var(--text-main); }
        .install-head { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
        .install-head img { width: 60px; height: 60px; border-radius: 18px; }
        .install-tabs { display: flex; gap: 6px; margin-bottom: 8px; }
        .install-tabs button { flex: 1; padding: 8px; border-radius: 10px; border: 1px solid var(--border); background: rgba(255,255,255,0.03);
            color: var(--text-muted); font-family: inherit; font-size: 14px; cursor: pointer; transition: all 0.2s; }
        .install-tabs button.on { background: var(--primary); border-color: var(--primary); color: #fff; }
        .login-install { margin-top: 14px; }

        /* =========================================================
           صفحة المادة
           ========================================================= */
        .back-btn { display: inline-flex; align-items: center; gap: 6px; background: none; border: none; color: var(--text-muted);
            font-size: 14px; font-weight: 600; cursor: pointer; padding: 6px 2px; margin-bottom: 12px; transition: color 0.2s, gap 0.3s var(--ease); }
        .back-btn:hover { color: var(--text-main); gap: 10px; }
        .subject-head { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
        .subject-head .subject-icon { width: 60px; height: 60px; font-size: 30px; border-radius: 18px; margin: 0; flex-shrink: 0; }
        .subject-head h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.3px; }
        .subject-head p { color: var(--text-muted); font-size: 13px; }

        .sub-tabs { position: relative; display: flex; gap: 4px; padding: 4px; margin-bottom: 20px; border-radius: 14px;
            background: rgba(2,6,23,0.4); border: 1px solid var(--border); overflow-x: auto; white-space: nowrap;
            -ms-overflow-style: none; scrollbar-width: none; }
        .sub-tabs::-webkit-scrollbar { display: none; }
        .tab-indicator { position: absolute; top: 4px; bottom: 4px; right: 0; width: 0; border-radius: 10px;
            background: rgba(255,255,255,0.08); border: 1px solid var(--border-strong);
            transition: transform 0.45s var(--ease), width 0.45s var(--ease); }
        .sub-tab-btn { position: relative; z-index: 1; flex: 1; background: transparent; border: none; color: var(--text-muted);
            font-size: 15px; font-weight: 600; cursor: pointer; padding: 9px 14px; border-radius: 10px; transition: color 0.3s; }
        .sub-tab-btn:hover { color: var(--text-main); }
        .sub-tab-btn .st-ico { margin-left: 6px; }
        .sub-tab-btn.active { color: #fff; }

        .modal-overlay {
            display: none; position: fixed; inset: 0;

        }
        @keyframes fadeIn { from { opacity: 0; } }
        @keyframes modalIn { from { opacity: 0; transform: translateY(24px) scale(0.94); } }

            font-size: 26px; background: rgba(79,140,255,0.14); flex-shrink: 0; }

        .subject-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
        .chip-pick { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px;
            border-radius: 999px; border: 1px solid var(--border-strong); background: rgba(255,255,255,0.03); color: var(--text-main);

        /* ---- نافذة المشاركة ---- */

            margin-bottom: 16px; color: var(--text-main); font-size: 14px; white-space: pre-wrap; word-break: break-word;
            max-height: 110px; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }

        .share-opt { position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; gap: 6px;

            background: rgba(79,140,255,0.06); border: 1px dashed rgba(79,140,255,0.45); border-radius: var(--radius-sm); padding: 12px 16px; margin-bottom: 16px; }
        .toolbar-info { color: var(--text-muted); font-weight: 600; }
        .btn-add { position: relative; overflow: hidden; border: none; color: #fff; padding: 10px 18px; border-radius: 12px; cursor: pointer;

        .act-open { position: relative; overflow: hidden; color: #fff; padding: 8px 16px; border-radius: 10px; text-decoration: none; font-weight: 700;
            font-size: 14px; display: flex; align-items: center; gap: 6px; transition: transform 0.25s var(--ease), filter 0.25s; }

        .drag-handle { cursor: grab; font-size: 18px; color: var(--text-muted); display: flex; align-items: center; justify-content: center; width: 28px; }
        .drag-handle:active { cursor: grabbing; color: var(--primary); }

        .search-box { position: relative; margin-bottom: 14px; }

        .no-results { display: none; }

        /* ---- الأسئلة والمراسلة ---- */
        .qa-compose { background: var(--item-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 20px; }
        .qa-compose-admin { border-color: rgba(245,158,11,0.45); background: rgba(245,158,11,0.05); }
        .qa-compose-title { font-weight: 700; margin-bottom: 10px; }
        textarea.input-field { resize: vertical; min-height: 76px; }
        .thread { background: var(--item-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; transition: border-color 0.3s; }
        .thread:hover { border-color: var(--border-strong); }
        .thread-admin { border-color: rgba(245,158,11,0.45); background: rgba(245,158,11,0.04); }
        .thread-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
        .who { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

        .reply .avatar { width: 24px; height: 24px; font-size: 11px; }
        .when { font-size: 12px; color: var(--text-dim); }
        .thread-text { color: #fff; white-space: pre-wrap; word-break: break-word; margin-bottom: 10px; }
        .chip { font-size: 11.5px; padding: 3px 10px; border-radius: 999px; font-weight: 600; }
        .chip-ok { background: rgba(16,185,129,0.14); color: #34d399; }
        .chip-wait { background: rgba(245,158,11,0.14); color: #fbbf24; }
        .chip-admin { background: rgba(245,158,11,0.18); color: #fbbf24; }
        .reply { border-radius: 12px; padding: 10px 12px; margin: 8px 0; white-space: pre-wrap; word-break: break-word; position: relative;
            animation: rise 0.45s var(--ease) both; }
        .reply-admin { background: rgba(16,185,129,0.08); border-right: 3px solid var(--success); }
        .reply-student { background: rgba(79,140,255,0.07); border-right: 3px solid var(--primary); }
        .reply .who { font-size: 13px; margin-bottom: 3px; }
        .reply-box { display: flex; gap: 8px; margin-top: 10px; }
        .reply-box .input-field { margin: 0; padding: 9px 12px; }
        .mini-del { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 13px; opacity: 0.7; transition: opacity 0.2s; }
        .mini-del:hover { opacity: 1; }

        /* ---- صفحة الدفعة والرسائل الأسبوعية ---- */
        .batch-hero { text-align: center; overflow: hidden; margin-bottom: 20px; padding: 30px 24px;
            background: linear-gradient(160deg, rgba(79,140,255,0.14), rgba(20,28,50,0.75) 60%); }
        .batch-hero .login-logo { width: 72px; height: 72px; border-radius: 22px; margin-bottom: 10px; }
        .batch-links { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 6px 0 22px; }
        .batch-links .btn { width: auto; padding: 10px 22px; }
        .emails { background: rgba(2,6,23,0.35); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
        .email-row { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; padding: 4px 0; color: var(--text-muted); font-size: 14px; }
        .email-row a { color: var(--text-main); text-decoration: none; direction: ltr; transition: color 0.2s; }
        .email-row a:hover { color: var(--primary); }

        .week-msg { position: relative; background: var(--item-bg); padding: 16px 18px; margin-bottom: 14px; border-radius: 16px;
            border: 1px solid var(--border); border-right: 3px solid rgba(245,158,11,0.7); }
        .week-msg.latest { border-color: rgba(245,158,11,0.55); border-right-width: 3px;
            background: linear-gradient(135deg, rgba(245,158,11,0.08), rgba(255,255,255,0.02));
            box-shadow: 0 18px 40px -24px rgba(245,158,11,0.55); }
        .week-msg-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
        .week-msg-date { font-size: 12px; color: var(--text-muted); }
        .week-msg-actions { display: flex; gap: 12px; }
        .week-msg-actions button { background: none; border: none; cursor: pointer; font-size: 13px; font-weight: 600; opacity: 0.85; transition: opacity 0.2s; }
        .week-msg-actions button:hover { opacity: 1; }
        .week-msg-text { color: #fff; font-size: 15px; margin-bottom: 6px; white-space: pre-wrap; word-break: break-word; }
        .week-chip { background: rgba(245,158,11,0.14); color: #fbbf24; padding: 3px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 700; margin-left: 6px; }

        .gallery { display: grid; gap: 6px; margin-top: 10px; border-radius: 14px; overflow: hidden; }
        .gallery.n1 { grid-template-columns: 1fr; }
        .gallery.n2, .gallery.n4 { grid-template-columns: 1fr 1fr; }
        .gallery.n3, .gallery.n5, .gallery.n6 { grid-template-columns: repeat(3, 1fr); }
        .gallery img { width: 100%; height: 100%; aspect-ratio: 4 / 3; object-fit: cover; cursor: zoom-in; display: block;
            background: var(--bg-color); transition: transform 0.5s var(--ease), filter 0.3s; }
        .gallery.n1 img { aspect-ratio: auto; max-height: 480px; object-fit: contain; }
        .gallery img:hover { filter: brightness(1.1); transform: scale(1.03); }

        .uploader { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .upload-btn { position: relative; overflow: hidden; background: rgba(79,140,255,0.06); border: 1px dashed rgba(79,140,255,0.6); color: #93b4ff;
            padding: 10px 14px; border-radius: 12px; cursor: pointer; font-weight: 700; transition: 0.25s; }
        .upload-btn:hover { background: rgba(79,140,255,0.12); }
        .previews { display: flex; gap: 8px; flex-wrap: wrap; }
        .preview { position: relative; width: 72px; height: 72px; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); animation: popIn 0.35s var(--spring) both; }
        .preview img { width: 100%; height: 100%; object-fit: cover; }
        .preview button { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; border: none;
            background: rgba(0,0,0,0.7); color: #fff; cursor: pointer; font-size: 14px; line-height: 1; }
        @keyframes popIn { from { opacity: 0; transform: scale(0.6); } }

        #lightbox { display: none; position: fixed; inset: 0; background: rgba(2,6,23,0.94); z-index: 10000;
            justify-content: center; align-items: center; padding: 56px 16px; backdrop-filter: blur(6px); touch-action: pan-y pinch-zoom; }
        #lightbox.show { display: flex; animation: fadeIn 0.25s ease both; }
        #lightbox.show img { animation: modalIn 0.4s var(--spring) both; }
        #lightbox img { max-width: 100%; max-height: 100%; border-radius: 12px; box-shadow: 0 30px 80px rgba(0,0,0,0.6); }
        #lightbox .lb-close { position: absolute; top: 8px; right: 14px; background: none; border: none; color: #fff; font-size: 34px; cursor: pointer; }
        #lightbox .lb-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 46px; height: 46px; border-radius: 50%; border: none;
            background: rgba(255,255,255,0.12); color: #fff; font-size: 24px; cursor: pointer; display: none; transition: background 0.2s; }
        #lightbox .lb-nav:hover { background: rgba(255,255,255,0.22); }

        #lightbox .lb-next { left: 12px; }
        #lightbox.multi .lb-nav { display: block; }
        #lightbox .lb-bar { position: absolute; bottom: 14px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; }
        #lightbox .lb-count { color: #cbd5e1; font-size: 14px; background: rgba(0,0,0,0.45); padding: 5px 12px; border-radius: 999px; display: none; }
        #lightbox.multi .lb-count { display: inline-block; }
        #lightbox .lb-dl { color: #fff; text-decoration: none; font-size: 14px; font-weight: 700; background: rgba(79,140,255,0.85); padding: 7px 16px; border-radius: 999px; }

        /* ---- صور السبورة ---- */
        .board-new { display: flex; flex-direction: column; gap: 10px; padding: 14px; margin-bottom: 18px; border-radius: 16px;
            background: rgba(79,140,255,0.06); border: 1px dashed rgba(79,140,255,0.45); }
        .board-new .input-field { margin: 0; }
        .board-new .btn { width: auto; align-self: flex-start; padding: 10px 26px; }
        .board-post { background: var(--item-bg); border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px; margin-bottom: 14px; }
        .board-head { display: flex; align-items: flex-start; gap: 10px; }
        .board-title { flex: 1; font-weight: 700; font-size: 16px; color: var(--text-main); word-break: break-word; }
        .board-meta { color: var(--text-muted); font-size: 12.5px; margin-top: 3px; font-weight: 400; }
        .board-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

        .board-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 12px; border-radius: 12px; overflow: hidden; }

        .board-cell { position: relative; }
        .board-cell img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; cursor: zoom-in; background: #0b1020;
            transition: transform 0.5s var(--ease), filter 0.3s; }

        .board-cell .img-del { position: absolute; top: 5px; left: 5px; width: 26px; height: 26px; border-radius: 50%; border: none;
            background: rgba(0,0,0,0.7); color: #fff; cursor: pointer; font-size: 15px; line-height: 1; }
        .upload-progress { color: var(--text-muted); font-size: 13.5px; }

        /* =========================================================
           التنبيهات والإشعارات
           ========================================================= */
        #toast-container {
            position: fixed; bottom: 34px; left: 50%; transform: translate(-50%, 140%) scale(0.9);
            opacity: 0; background: rgba(20, 28, 50, 0.92); color: #fff; padding: 12px 22px;
            border-radius: 999px; box-shadow: 0 20px 40px -12px rgba(0,0,0,0.7);
            font-weight: 600; border: 1px solid var(--border-strong);
            transition: transform 0.5s var(--spring), opacity 0.3s;
            z-index: 9999; display: flex; align-items: center; gap: 10px;
            pointer-events: none; white-space: nowrap; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }
        #toast-container.show { transform: translate(-50%, 0) scale(1); opacity: 1; }

        #alert-banner {
            position: fixed; top: 14px; left: 50%; transform: translate(-50%, -160%); width: min(92vw, 460px);
            background: rgba(20, 28, 50, 0.95); border: 1px solid rgba(245,158,11,0.5); border-radius: 18px;
            padding: 12px 14px; display: flex; gap: 12px; align-items: center; z-index: 9998; cursor: pointer;
            box-shadow: 0 24px 50px -14px rgba(0,0,0,0.7); transition: transform 0.55s var(--spring);
            backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        }
        #alert-banner.show { transform: translate(-50%, 0); }
        #alert-icon { font-size: 26px; width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: rgba(245,158,11,0.14); flex-shrink: 0; }
        #alert-title { font-weight: 700; color: #fbbf24; }
        #alert-body { color: var(--text-main); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #alert-banner button { background: none; border: none; color: var(--text-muted); font-size: 22px; cursor: pointer; }

        /* =========================================================
           الحركة
           ========================================================= */
        /* دخول الصفحة */
        .page-in { animation: pageIn 0.55s var(--ease) both; }
        @keyframes pageIn { from { opacity: 0; transform: translateY(14px); } }

        /* ظهور العناصر عند التمرير (واحداً تلو الآخر) */
        .reveal { opacity: 0; }
        .reveal.in { animation: rise 0.6s var(--ease) both; animation-delay: var(--d, 0ms); }
        @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(0.98); } to { opacity: 1; transform: none; } }

        /* هيكل التحميل */
        .skeleton { height: 74px; border-radius: 16px; margin-bottom: 10px; border: 1px solid var(--border);
            background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%);
            background-size: 200% 100%; animation: shimmer 1.3s infinite linear; }
        @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

        /* روابط داخل النصوص */
        .linkified { color: #7aa8ff; text-decoration: underline; text-underline-offset: 3px; word-break: break-all; }

        /* إطار واضح عند التنقل بلوحة المفاتيح */
        button:focus-visible, a:focus-visible, .input-field:focus-visible, summary:focus-visible {
            outline: 2px solid var(--primary); outline-offset: 2px;
        }

        /* شريط التمرير */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.2); border-radius: 10px; border: 2px solid var(--bg-color); }
        ::-webkit-scrollbar-thumb:hover { background: rgba(148,163,184,0.35); }

        /* =========================================================
           الهاتف: شريط تنقل سفلي مثل التطبيقات
           ========================================================= */
        @media (max-width: 640px) {
            /* بدون تأثير الزجاج هنا: كان يحبس الشريط السفلي داخل الرأس */
            header { padding: 10px 16px; justify-content: center; backdrop-filter: none; -webkit-backdrop-filter: none;
                background: rgba(10, 15, 30, 0.94); animation: none; }
            nav {
                position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;

    <!-- نافذة إضافة ملف / فيديو -->

    <!-- نافذة تعديل الرسالة الأسبوعية -->

    <script>

        const API_URL = "";
        let currentUser = null;
        let currentTab = 'subjects';
        let currentSubjectId = null;
        let activeSubTab = 'files';

        const SUBJECTS = [
            { id: 'oop', name: 'برمجة شيئية', icon: '💻', color: '#3b82f6' },
            { id: 'num_analysis', name: 'التحليل العددي', icon: '📐', color: '#8b5cf6' },
            { id: 'computation', name: 'النظرية الاحتسابية', icon: '🧮', color: '#ec4899' },
            { id: 'python', name: 'لغة بايثون', icon: '🐍', color: '#10b981' },
            { id: 'arabic', name: 'اللغة العربية', icon: '📚', color: '#f59e0b' },
            { id: 'ai_algo', name: 'خوارزميات AI', icon: '🤖', color: '#06b6d4' }
        ];

        // ---------- أدوات مساعدة ----------
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '#';
        const isAdmin = () => currentUser && currentUser.role === 'admin';

        // يحوّل الروابط داخل النص إلى روابط قابلة للضغط (بعد تهريب النص)
        const linkify = s => esc(s).replace(/https?:\/\/[^\s<]+/g, u => {
            const trail = (u.match(/[.,;:!?)\]،]+$/) || [''])[0];
            const url = trail ? u.slice(0, -trail.length) : u;
            return `<a class="linkified" href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>${trail}`;
        });

        // توحيد الحروف العربية للبحث (أ إ آ = ا، ة = ه، ى = ي) وإزالة التشكيل
        const normAr = s => String(s || '').toLowerCase()
            .replace(/[ً-ْـ]/g, '')
            .replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي');

        const skeleton = (n = 3) => Array(n).fill('<div class="skeleton"></div>').join('');

        function youtubeId(url) {
            const m = String(url || '').match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/|\/live\/)([\w-]{11})/);
            return m ? m[1] : null;
        }

        function copyText(text, okMsg = 'تم النسخ') {
            const done = () => showToast(okMsg);
            if (navigator.clipboard) navigator.clipboard.writeText(text).then(done).catch(() => prompt('انسخ:', text));
            else prompt('انسخ:', text);
        }

        // إغلاق النوافذ بزر Esc أو بالضغط خارجها
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') { closeAddModal(); closeEditMsg(); closeLightbox(); closeShare(); closeShareIn(); closeInstall(); }
        });
        document.addEventListener('click', e => {
            if (e.target.classList && e.target.classList.contains('modal-overlay')) e.target.style.display = 'none';
        });

        // =========================================================
        // الحركة والتأثيرات
        // =========================================================
        const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        const finePointer = window.matchMedia && matchMedia('(pointer: fine)').matches;

        // تموّج عند الضغط على الأزرار
        document.addEventListener('pointerdown', e => {
            if (reduceMotion) return;
            const el = e.target.closest('.btn, .nav-btn, .act-open, .act-icon, .btn-add, .upload-btn, .btn-delete, .sub-tab-btn');
            if (!el) return;
            const r = el.getBoundingClientRect();
            const size = Math.max(r.width, r.height);
            const dot = document.createElement('span');
            dot.className = 'ripple';
            dot.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - r.left - size / 2}px;top:${e.clientY - r.top - size / 2}px`;
            if (getComputedStyle(el).position === 'static') el.style.position = 'relative';
            el.style.overflow = 'hidden';
            el.appendChild(dot);
            dot.addEventListener('animationend', () => dot.remove());
        });

        // ظهور العناصر واحداً تلو الآخر عندما تصل إليها الشاشة
        const revealIO = ('IntersectionObserver' in window && !reduceMotion) ? new IntersectionObserver(entries => {
            let k = 0;
            entries.forEach(en => {
                if (!en.isIntersecting) return;
                const el = en.target;
                revealIO.unobserve(el);
                el.style.setProperty('--d', Math.min(k++, 8) * 70 + 'ms');
                el.classList.add('in');
                // بعد انتهاء الحركة نزيلها كي لا تتعارض مع حركة المرور بالمؤشر
                el.addEventListener('animationend', function done(ev) {
                    if (ev.target !== el) return;
                    el.removeEventListener('animationend', done);
                    el.classList.remove('reveal', 'in');
                    el.style.removeProperty('--d');
                });
            });
        }, { rootMargin: '0px 0px -30px 0px' }) : null;

        function watchReveal(el) {
            if (!revealIO) { el.classList.remove('reveal'); return; }
            revealIO.observe(el);
        }
        // أي محتوى جديد يُضاف للصفحة يحصل على الحركة تلقائياً
        new MutationObserver(muts => {
            muts.forEach(m => m.addedNodes.forEach(n => {
                if (n.nodeType !== 1) return;
                if (n.classList.contains('reveal')) watchReveal(n);
                n.querySelectorAll('.reveal:not(.in)').forEach(watchReveal);
            }));
            scheduleRevealSafety();
        }).observe(document.getElementById('app-content'), { childList: true, subtree: true });

        // أمان: أي عنصر ظاهر في الشاشة ولم يتحرك خلال ثانية يُعرض فوراً
        // (بعض متصفحات التطبيقات القديمة لا تدعم مراقبة التمرير جيداً)
        let revealSafetyTimer = null;
        function scheduleRevealSafety() {
            clearTimeout(revealSafetyTimer);
            revealSafetyTimer = setTimeout(() => {
                document.querySelectorAll('.reveal:not(.in)').forEach(el => {
                    const r = el.getBoundingClientRect();
                    if (r.top < innerHeight && r.bottom > 0) {
                        if (revealIO) revealIO.unobserve(el);
                        el.classList.remove('reveal');
                    }
                });
            }, 1000);
        }
        window.addEventListener('scroll', () => { if (document.querySelector('.reveal:not(.in)')) scheduleRevealSafety(); }, { passive: true });

        // إضاءة تتبع المؤشر + ميلان خفيف لبطاقات المواد (للحاسوب فقط)
        if (finePointer && !reduceMotion) {
            document.addEventListener('pointermove', e => {
                const card = e.target.closest && e.target.closest('.subject-card');
                if (!card) return;
                const r = card.getBoundingClientRect();
                const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
                card.style.setProperty('--mx', (x * 100) + '%');
                card.style.setProperty('--my', (y * 100) + '%');
                card.style.setProperty('--ry', ((x - 0.5) * 7) + 'deg');
                card.style.setProperty('--rx', ((0.5 - y) * 7) + 'deg');
            });
            document.addEventListener('pointerout', e => {
                const card = e.target.closest && e.target.closest('.subject-card');
                if (card && !card.contains(e.relatedTarget)) { card.style.setProperty('--rx', '0deg'); card.style.setProperty('--ry', '0deg'); }
            });
        }

        // مؤشر منزلق خلف الزر النشط (ينزلق من موضعه السابق إلى الجديد)
        const indicatorPos = {};
        function slideIndicator(indicator, target, key) {
            if (!indicator || !target) return;
            const parent = indicator.parentElement.getBoundingClientRect();
            const r = target.getBoundingClientRect();
            if (!r.width) return;
            const x = r.right - parent.right; // المسافة من اليمين (اتجاه عربي)
            const prev = indicatorPos[key];
            indicatorPos[key] = { x, w: r.width };
            if (prev && !reduceMotion) {
                indicator.style.transition = 'none';
                indicator.style.width = prev.w + 'px';
                indicator.style.transform = `translateX(${prev.x}px)`;
                void indicator.offsetWidth;
                indicator.style.transition = '';
            }
            indicator.style.width = r.width + 'px';
            indicator.style.transform = `translateX(${x}px)`;
        }
        window.addEventListener('resize', () => {
            const active = document.querySelector('.nav-btn.active');
            slideIndicator(document.getElementById('nav-indicator'), active, 'nav');
            slideIndicator(document.querySelector('.tab-indicator'), document.querySelector('.sub-tab-btn.active'), 'tabs');
        });

        // عدّاد يتصاعد حتى الرقم المطلوب
        function countUp(el, to) {
            if (!el) return;
            if (reduceMotion || !to) { el.textContent = to; return; }
            const start = performance.now(), dur = 900;
            const step = now => {
                const t = Math.min(1, (now - start) / dur);
                el.textContent = Math.round(to * (1 - Math.pow(1 - t, 3)));
                if (t < 1) requestAnimationFrame(step);
            };
            requestAnimationFrame(step);
        }

        // صورة رمزية بالحرف الأول ولون ثابت لكل اسم
        function avatarHTML(name, admin) {
            const n = String(name || '؟').trim();
            if (admin) return `<span class="avatar" style="background: linear-gradient(135deg,#f59e0b,#d97706);">👨‍🏫</span>`;
            let h = 0;
            for (const c of n) h = (h * 31 + c.charCodeAt(0)) % 360;
            return `<span class="avatar" style="background: hsl(${h} 55% 42%);">${esc(n.charAt(0))}</span>`;
        }

        async function api(path, method = 'GET', body = null) {
            const opts = { method, headers: { 'Content-Type': 'application/json' } };
            if (currentUser && currentUser.token) opts.headers['X-Admin-Token'] = currentUser.token;
            if (body) opts.body = JSON.stringify(body);
            const res = await fetch(API_URL + path, opts);
            if (res.status === 401 && isAdmin()) {
                alert('انتهت صلاحية الدخول، سجّل الدخول من جديد');
                logout();
                throw new Error('unauthorized');
            }
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
        }

        function showToast(message, icon = '✅') {
            const toast = document.getElementById('toast-container');
            toast.innerHTML = `${icon} ${esc(message)}`;
            toast.classList.add('show');
            clearTimeout(showToast._t);
            showToast._t = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // ---------- الدخول وزر الرجوع للهاتف ----------
        window.addEventListener('popstate', function (event) {
            if (!currentUser) return;
            if (event.state && event.state.page === 'subject') {
                currentSubjectId = event.state.id;
                currentTab = 'subject_details';
            } else if (event.state && event.state.page === 'main') {
                currentTab = event.state.tab;
            } else {
                currentTab = 'subjects';
            }
            render();
        });

        function init() {
            const saved = localStorage.getItem('batchUser');
            if (saved) {
                try { currentUser = JSON.parse(saved); } catch (e) { currentUser = null; }
            }
            if (currentUser) {
                document.getElementById('main-header').style.display = 'flex';
                const rb = document.getElementById('role-badge');
                rb.textContent = isAdmin() ? '👨‍🏫 أدمن' : '';
                rb.style.display = isAdmin() ? 'inline-block' : 'none';

                // فتح نفس الصفحة بعد التحديث (مثلاً #subject-python أو #batch)
                goToHash(location.hash, false);
                startPolling();
                processPendingShare(); // فيديو أو رابط شاركه الطالب إلى التطبيق
            } else {
                document.getElementById('main-header').style.display = 'none';
                renderLogin();
            }
        }

        // ---------- التنبيهات بالمحتوى الجديد ----------
        // يتحقق الموقع كل دقيقة من وجود ملف أو تبليغ جديد ما دام مفتوحاً،
        // ويشغّل صوت التنبيه إذا فعّل الطالب الجرس 🔔
        const POLL_MS = 60 * 1000;
        let pollTimer = null;
        let alertTarget = null;
        let alertTimer = null;

        const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
        const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
        const soundOn = () => lsGet('soundOn') === '1';

        function updateBellUI() {
            const b = document.getElementById('bell-btn');
            if (!b) return;
            b.querySelector('.nav-ico').textContent = soundOn() ? '🔔' : '🔕';
            b.classList.toggle('on', soundOn());
            b.title = soundOn() ? 'التنبيهات الصوتية مفعّلة (اضغط للإيقاف)' : 'تفعيل التنبيهات الصوتية';
        }

        function playSound() {
            const a = document.getElementById('notify-sound');
            if (!a) return;
            try {
                a.currentTime = 0;
                const p = a.play();
                if (p && p.catch) p.catch(() => {});
            } catch (e) {}
        }

        async function toggleBell() {
            const on = !soundOn();
            lsSet('soundOn', on ? '1' : '0');
            updateBellUI();
            const card = document.getElementById('push-prompt');
            if (card) card.remove();
            if (on) {
                playSound(); // تجربة الصوت (وتسمح للتطبيق بتشغيله لاحقاً)
                const pushed = await enablePush(true);
                showToast(pushed ? 'تم تفعيل الإشعارات على جوالك' : 'تم تفعيل التنبيهات داخل التطبيق', '🔔');
            } else {
                await disablePush();
                showToast('تم إيقاف الإشعارات', '🔕');
            }
        }

        function showAlert(a) {
            alertTarget = a.target;
            document.getElementById('alert-icon').textContent = a.icon;
            document.getElementById('alert-title').textContent = a.title;
            document.getElementById('alert-body').textContent = a.body;
            const el = document.getElementById('alert-banner');
            el.classList.add('show');
            clearTimeout(alertTimer);
            alertTimer = setTimeout(hideAlert, 8000);
        }

        function hideAlert() { document.getElementById('alert-banner').classList.remove('show'); }

        function openAlertTarget() {
            hideAlert();
            const t = alertTarget;
            if (!t) return;
            if (t.page === 'batch') switchMainTab('batch');
            else if (t.page === 'subject') openSubject(t.id, t.sub || 'files');
        }

        function systemNotify(a) {
            if (!('Notification' in window) || Notification.permission !== 'granted' || !document.hidden) return;
            try { new Notification(a.title, { body: a.body, tag: 'study-assistant' }); } catch (e) {}
        }

        function markMessagesViewed(id) {
            lsSet('viewed_msg', id);
            const dot = document.getElementById('batch-dot');
            if (dot) dot.style.display = 'none';
        }

        function updateBatchDot(latestMsgId) {
            const dot = document.getElementById('batch-dot');
            if (!dot) return;
            const viewed = parseInt(lsGet('viewed_msg')) || 0;
            dot.style.display = (latestMsgId > viewed && currentTab !== 'batch') ? 'block' : 'none';
        }

        // silent = تحديث المرجع بدون تنبيه (مثلاً بعد أن ينشر الأدمن بنفسه)
        async function checkForNew(silent = false) {
            if (!currentUser) return;
            let d;
            try { d = await api('/api/updates/latest'); } catch (e) { return; }
            const lec = d.lecture, msg = d.message;
            const prevLec = lsGet('notified_lec'), prevMsg = lsGet('notified_msg');
            const alerts = [];

            if (lec && prevLec !== null && lec.id > Number(prevLec)) {
                const sub = SUBJECTS.find(s => s.id === lec.subject_id);
                const k = lecKind(lec.title), ui = KIND_UI[k];
                alerts.push({
                    icon: ui.icon,
                    title: ui.fresh + (sub ? ' في ' + sub.name : ''),
                    body: String(lec.title).replace(PREFIX_RE, ''),
                    target: sub ? { page: 'subject', id: sub.id, sub: TAB_OF[k] } : null,
                });
            }
            if (msg && prevMsg !== null && msg.id > Number(prevMsg)) {
                alerts.push({ icon: '📣', title: 'تبليغ جديد للدفعة', body: msg.text || '🖼️ صورة جديدة', target: { page: 'batch' } });
            }

            lsSet('notified_lec', lec ? lec.id : 0);
            lsSet('notified_msg', msg ? msg.id : 0);
            updateBatchDot(msg ? msg.id : 0);

            if (silent || !alerts.length) return;
            const a = alerts[alerts.length - 1]; // التبليغ أولى من الملف إذا وصل الاثنان معاً
            showAlert(a);
            systemNotify(a);
            if (soundOn()) playSound();

            // تحديث الصفحة الحالية لتظهر المحتويات الجديدة
            if (currentTab === 'subjects') render();
            else if (currentTab === 'batch') fetchWeeklyMessages();
        }

        function startPolling() {
            updateBellUI();
            if (soundOn()) enablePush(false); // تجديد الاشتراك بصمت عند كل فتح
            if (pollTimer) return;
            checkForNew();
            pollTimer = setInterval(() => { if (!document.hidden) checkForNew(); }, POLL_MS);
            document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForNew(); });
        }

        // يفتح الصفحة المطلوبة من رابط مثل #subject-python أو #batch
        function goToHash(rawHash, push = true) {
            const hash = String(rawHash || '').replace(/^#/, '');
            // مثال: #subject-python أو #subject-python/board لفتح تبويب معيّن
            const subMatch = hash.match(/^subject-([^/]+)(?:\/(\w+))?$/);
            const save = push ? history.pushState.bind(history) : history.replaceState.bind(history);
            if (subMatch && SUBJECTS.some(s => s.id === subMatch[1])) {
                currentSubjectId = subMatch[1];
                currentTab = 'subject_details';
                activeSubTab = ['files', 'summaries', 'videos', 'board', 'qa'].includes(subMatch[2]) ? subMatch[2] : 'files';
                save({ page: 'subject', id: currentSubjectId }, '', '#subject-' + currentSubjectId);
            } else {
                currentTab = hash === 'batch' ? 'batch' : 'subjects';
                save({ page: 'main', tab: currentTab }, '', '#' + currentTab);
            }
            render();
        }

        // ---------- إشعارات الجوال (تصل حتى لو كان التطبيق مغلقاً) ----------
        const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;

        function b64ToBytes(b64) {
            const s = atob((b64 + '='.repeat((4 - b64.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/'));
            return Uint8Array.from(s, c => c.charCodeAt(0));
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
            // الضغط على إشعار والتطبيق مفتوح: ننتقل للصفحة المقصودة
            navigator.serviceWorker.addEventListener('message', e => {
                if (e.data && e.data.type === 'navigate' && currentUser) goToHash(e.data.hash);
            });
        }

        async function enablePush(interactive = true) {
            if (!pushSupported()) return false;
            let perm = Notification.permission;
            if (perm === 'default' && interactive) perm = await Notification.requestPermission();
            if (perm !== 'granted') {
                if (interactive) showToast('اسمح للتطبيق بالإشعارات من إعدادات الجوال', '⚠️');
                return false;
            }
            try {
                const { key } = await api('/api/push/key');
                if (!key) return false;
                const reg = await navigator.serviceWorker.ready;
                let sub = await reg.pushManager.getSubscription();
                if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(key) });
                await api('/api/push/subscribe', 'POST', sub.toJSON());
                return true;
            } catch (e) {
                if (interactive) showToast('تعذر تفعيل إشعارات الجوال', '❌');
                return false;
            }
        }

        async function disablePush() {
            if (!pushSupported()) return;
            try {
                const reg = await navigator.serviceWorker.ready;
                const sub = await reg.pushManager.getSubscription();
                if (sub) {
                    await api('/api/push/unsubscribe', 'POST', { endpoint: sub.endpoint }).catch(() => {});
                    await sub.unsubscribe();
                }
            } catch (e) {}
        }

        // بطاقة تدعو الطالب لتفعيل الإشعارات (تظهر مرة حتى يفعّلها أو يخفيها)
        // ---------- تحميل التطبيق ----------
        let deferredInstall = null;   // نافذة التثبيت الجاهزة من كروم (أندرويد/كمبيوتر)
        let apkLink = null;           // رابط ملف APK إن وُجد على الموقع
        const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true
            || document.referrer.startsWith('android-app://');
        const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        const isAndroid = () => /android/i.test(navigator.userAgent);

        window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; });
        window.addEventListener('appinstalled', () => {
            deferredInstall = null;
            closeInstall();
            document.getElementById('install-prompt')?.remove();
            showToast('🎉 تم تثبيت التطبيق! تجده على الشاشة الرئيسية');
        });
        fetch('/api/app-info').then(r => r.json()).then(d => { apkLink = d.apk || null; }).catch(() => {});

        function installPromptHTML() {
            if (isStandalone() || lsGet('installPromptHidden') === '1') return '';
            return `
                <div class="push-prompt install-prompt reveal" id="install-prompt">
                    <img class="app-ico" src="/icons/icon-192.png" alt="">
                    <div style="flex: 1; min-width: 0;">
                        <div style="font-weight: 700;">حمّل التطبيق</div>
                        <div style="color: var(--text-muted); font-size: 13.5px;">إشعارات فورية، ومشاركة من يوتيوب بضغطة.</div>
                    </div>
                    <button class="btn" style="width: auto;" onclick="installApp()">📲 تحميل</button>
                    <button class="close-modal" title="إخفاء" onclick="lsSet('installPromptHidden','1'); document.getElementById('install-prompt').remove();">&times;</button>
                </div>`;
        }

        async function installApp() {
            if (isStandalone()) { showToast('التطبيق مثبت عندك بالفعل ✅'); return; }
            if (deferredInstall && !apkLink) {
                // كروم يعرض نافذة التثبيت الرسمية مباشرة
                const ev = deferredInstall;
                ev.prompt();
                try { if ((await ev.userChoice).outcome === 'accepted') deferredInstall = null; } catch (e) {}
                return;
            }
            openInstall(isIOS() ? 'ios' : isAndroid() ? 'android' : 'pc');
        }

        async function promptInstall() {
            const ev = deferredInstall;
            if (!ev) return;
            closeInstall();
            ev.prompt();
            try { if ((await ev.userChoice).outcome === 'accepted') deferredInstall = null; } catch (e) {}
        }

        function openInstall(platform) {
            const inApp = /; wv\)|FBAN|FBAV|Instagram|Telegram/i.test(navigator.userAgent);
            const notInside = inApp ? ' (وليس من داخل تليكرام أو تطبيق آخر)' : '';
            const steps = {
                android: [
                    'افتح الموقع من متصفح <b>Google Chrome</b>' + notInside,
                    'اضغط على <b>⋮</b> في أعلى الشاشة',
                    'اختر <b>«تثبيت التطبيق»</b> أو <b>«إضافة إلى الشاشة الرئيسية»</b> ثم <b>تثبيت</b>',
                    'ستجد <b>مساعد دراسي</b> بين تطبيقاتك 🎉',
                ],
                ios: [
                    'افتح الموقع من متصفح <b>Safari</b>' + notInside,
                    'اضغط زر المشاركة <b>⬆️</b> في أسفل الشاشة',
                    'اختر <b>«إضافة إلى الشاشة الرئيسية»</b> ثم <b>إضافة</b>',
                    'ستجد <b>مساعد دراسي</b> على شاشتك 🎉',
                ],
                pc: [
                    'افتح الموقع من <b>Chrome</b> أو <b>Edge</b>',
                    'اضغط أيقونة التثبيت <b>⊕</b> في نهاية شريط العنوان، أو من القائمة <b>⋮</b> اختر <b>«تثبيت مساعد دراسي»</b>',
                    'يفتح التطبيق بنافذة مستقلة 🎉',
                ],
            };
            const tab = (id, label) => `<button class="${platform === id ? 'on' : ''}" onclick="openInstall('${id}')">${label}</button>`;
            document.getElementById('install-body').innerHTML = `
                ${deferredInstall ? `<button class="btn" style="margin-bottom: 10px;" onclick="promptInstall()">📲 تثبيت الآن بضغطة واحدة</button>` : ''}
                ${apkLink ? `
                    <a class="btn ${deferredInstall ? 'btn-outline' : ''}" href="${esc(apkLink)}" download style="text-decoration: none; margin-bottom: 6px;">⬇️ تحميل ملف APK للأندرويد</a>
                    <div style="color: var(--text-muted); font-size: 12.5px; text-align: center; margin-bottom: 14px;">بعد التحميل افتح الملف واسمح بالتثبيت إذا طلب جوالك ذلك.</div>` : ''}
                ${deferredInstall || apkLink ? `<div class="divider">أو يدوياً</div>` : ''}
                <div class="install-tabs">${tab('android', '🤖 أندرويد')}${tab('ios', '📱 آيفون')}${tab('pc', '💻 كمبيوتر')}</div>
                <ol class="install-steps">${steps[platform].map(t => `<li><span>${t}</span></li>`).join('')}</ol>
                <button class="btn btn-outline" onclick="copyText(SITE, 'تم نسخ رابط الموقع')">📋 نسخ رابط الموقع</button>`;
            document.getElementById('installModal').style.display = 'flex';
        }

        function closeInstall() { const m = document.getElementById('installModal'); if (m) m.style.display = 'none'; }

        function pushPromptHTML() {
            if (soundOn() || lsGet('pushPromptHidden') === '1') return '';
            if (pushSupported() && Notification.permission === 'denied') return '';
            return `
                <div class="push-prompt reveal" id="push-prompt">
                    <div class="bell-ico">🔔</div>
                    <div style="flex: 1;">
                        <div style="font-weight: 700;">فعّل الإشعارات</div>
                        <div style="color: var(--text-muted); font-size: 14px;">تصلك رسالة على جوالك فور نشر ملف أو شرح أو تبليغ جديد.</div>
                    </div>
                    <button class="btn" style="width: auto;" onclick="toggleBell()">تفعيل</button>
                    <button class="close-modal" title="إخفاء" onclick="lsSet('pushPromptHidden','1'); document.getElementById('push-prompt').remove();">&times;</button>
                </div>`;
        }

        function renderLogin() {
            document.getElementById('app-content').innerHTML = `
                <div class="login-wrapper card page-in">
                    <img class="login-logo" src="/icons/icon-192.png" alt="">
                    <div class="login-title">مساعد دراسي</div>
                    <div class="login-sub">علوم الذكاء الاصطناعي • المرحلة الثانية</div>

                    <div>
                        <input type="text" id="student-name" class="input-field" placeholder="اسمك (اختياري)" maxlength="40"
                               onkeydown="if(event.key==='Enter') studentLogin()">
                        <button class="btn" onclick="studentLogin()">دخول كطالب <span>←</span></button>
                    </div>

                    <div class="divider">أو</div>

                    <details class="admin-login">
                        <summary>🔐 دخول الأدمن</summary>
                        <div>
                            <input type="password" id="login-pass" class="input-field" placeholder="كلمة مرور الأدمن" dir="ltr"
                                   onkeydown="if(event.key==='Enter') adminLogin()">
                            <button class="btn btn-outline" onclick="adminLogin()">دخول كأدمن</button>
                        </div>
                    </details>
                    ${isStandalone() ? '' : `<button class="btn btn-outline login-install" onclick="installApp()">📲 تحميل التطبيق على جوالك</button>`}
                </div>
            `;
        }

        function studentLogin() {
            const sn = (document.getElementById('student-name')?.value || '').trim().slice(0, 40);
            currentUser = { role: 'student', name: sn || 'طالب' };
            localStorage.setItem('batchUser', JSON.stringify(currentUser));
            init();
        }

        async function adminLogin() {
            const password = document.getElementById('login-pass').value;
            if (!password) return;
            try {
                const res = await fetch(API_URL + '/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                if (res.status === 401) return alert('كلمة المرور خاطئة');
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    return alert('خطأ في الخادم: ' + (err.error || res.status));
                }

                currentUser = await res.json();
                localStorage.setItem('batchUser', JSON.stringify(currentUser));
                init();
            } catch (e) {
                alert('تعذر الاتصال بالخادم');
            }
        }

        function logout() {
            localStorage.removeItem('batchUser');
            currentUser = null;
            history.replaceState(null, '', '/');
            init();
        }

        // ---------- التنقل ----------
        function switchMainTab(tab) {
            currentTab = tab;
            history.pushState({ page: 'main', tab: tab }, '', '#' + tab);
            render();
        }

        function render() {
            const app = document.getElementById('app-content');

            // تحديث لون الزر النشط في الأعلى (يعمل أيضاً عند زر الرجوع)
            const activeNav = currentTab === 'subject_details' ? 'subjects' : currentTab;
            document.querySelectorAll('.nav-btn[data-tab]').forEach(btn =>
                btn.classList.toggle('active', btn.dataset.tab === activeNav));
            requestAnimationFrame(() => slideIndicator(
                document.getElementById('nav-indicator'), document.querySelector('.nav-btn[data-tab].active'), 'nav'));

            // إعادة تشغيل حركة دخول الصفحة في كل مرة يتم فيها التبديل
            app.classList.remove('page-in');
            void app.offsetWidth;
            app.classList.add('page-in');

            app.innerHTML = '';
            if (currentTab === 'subjects') renderSubjects(app);
            else if (currentTab === 'batch') renderBatch(app);
            else if (currentTab === 'subject_details') renderSubjectDetails(app);
            if (currentTab !== 'subject_details') window.scrollTo({ top: 0 });
        }

        function renderSubjects(app) {
            const hour = new Date().getHours();
            const greet = hour < 12 ? 'صباح الخير' : hour < 18 ? 'مساء الخير' : 'مساء النور';
            const name = (currentUser && currentUser.name && currentUser.name !== 'طالب') ? '، ' + esc(currentUser.name) : '';
            let today = '';
            try { today = new Date().toLocaleDateString('ar-IQ', { weekday: 'long', day: 'numeric', month: 'long' }); } catch (e) {}

            app.innerHTML = `
                <div class="card hero reveal">
                    <div class="hero-top">
                        <div>
                            <div class="hero-greet">${greet}${name} <span class="wave">👋</span></div>
                            <div class="hero-date">${esc(today)} • جاهز للدراسة؟</div>
                        </div>
                    </div>
                    <div class="stats">
                        <div class="stat"><div class="stat-num" id="stat-subjects">0</div><div class="stat-label">مواد دراسية</div></div>
                        <div class="stat"><div class="stat-num" id="stat-files">0</div><div class="stat-label">ملف دراسي</div></div>
                        <div class="stat"><div class="stat-num" id="stat-videos">0</div><div class="stat-label">شرح فيديو</div></div>
                    </div>
                </div>
                ${installPromptHTML()}
                ${pushPromptHTML()}
                <div class="section-title">📚 المواد الدراسية</div>
                <div class="grid-container">` + SUBJECTS.map(sub => `
                <div class="card subject-card reveal" style="--accent: ${sub.color}; --accent-soft: ${sub.color}26; --accent-glow: ${sub.color}66;"
                     onclick="openSubject('${sub.id}')">
                    <span id="badge-${sub.id}" class="new-badge">جديد</span>
                    <span id="pend-${sub.id}" class="pend-badge"></span>
                    <div class="subject-icon">${sub.icon}</div>
                    <div class="card-title" style="margin-bottom: 12px;">${sub.name}</div>
                    <div class="sub-count" id="count-${sub.id}">&nbsp;</div>
                    <button class="btn">فتح المادة <span class="arrow">←</span></button>
                </div>
            `).join('') + `</div>`;
            countUp(document.getElementById('stat-subjects'), SUBJECTS.length);

            api('/api/updates/check').then(updates => {
                window.latestUpdates = updates;
                let totalF = 0, totalV = 0;
                SUBJECTS.forEach(sub => {
                    totalF += (updates[sub.id] || {}).files || 0;
                    totalV += (updates[sub.id] || {}).videos || 0;
                });
                countUp(document.getElementById('stat-files'), totalF);
                countUp(document.getElementById('stat-videos'), totalV);
                SUBJECTS.forEach(sub => {
                    const info = updates[sub.id] || {};
                    const storedMax = parseInt(localStorage.getItem(`max_id_${sub.id}`)) || 0;
                    const currentMax = info.max_id || 0;
                    const badge = document.getElementById(`badge-${sub.id}`);
                    if (badge && currentMax > storedMax) badge.style.display = 'inline-block';
                    const count = document.getElementById(`count-${sub.id}`);
                    if (count) {
                        const f = info.files || 0, v = info.videos || 0, m = info.summaries || 0, b = info.boards || 0;
                        count.textContent = (f || v || m || b)
                            ? `${f} ملف${m ? ` • ${m} ملخص` : ''} • ${v} شرح${b ? ` • ${b} سبورة` : ''}` : 'لا يوجد محتوى بعد';
                    }
                });
            }).catch(() => console.log('فشل فحص التحديثات'));

            if (isAdmin()) {
                api('/api/admin/pending').then(p => {
                    SUBJECTS.forEach(sub => {
                        const el = document.getElementById(`pend-${sub.id}`);
                        const n = p[sub.id] || 0;
                        if (el && n > 0) { el.textContent = `❓ ${n} بانتظار الرد`; el.style.display = 'inline-block'; }
                    });
                }).catch(() => {});
            }
        }

        function renderBatch(app) {
            app.innerHTML = `
                <div class="card batch-hero reveal">
                    <img class="login-logo" src="/icons/icon-192.png" alt="">
                    <div class="card-title" style="font-size: 23px; color: white;">علوم الذكاء الاصطناعي - المرحلة الثانية</div>
                    <div style="color: var(--text-muted); font-size: 15px;">إشراف وإدارة: مهدي (ممثل الدفعة)</div>

                    <p style="color: var(--text-muted); font-size: 14.5px; margin: 14px auto 16px; line-height: 1.9; max-width: 560px;">
                        هذا النظام مخصص لتنظيم المحاضرات والأسئلة. جميع الشروحات والمواد تقدم للطلاب مجاناً ولا يتطلب النظام أي أكواد دعوة لتنزيل الملفات.

                    <div class="batch-links">

                        <a href="https://t.me/+W0Dwz5CDcmEwNDNi" target="_blank" rel="noopener" class="btn" style="background: linear-gradient(135deg,#2dd4bf,#14b8a6); color: #042f2e; box-shadow: 0 10px 22px -12px #2dd4bf;">💬 كروب المناقشة</a>
                        <a href="https://t.me/+vv2ot9xsKBE0NmZi" target="_blank" rel="noopener" class="btn" style="background: linear-gradient(135deg,#0ea5e9,#0284c7); box-shadow: 0 10px 22px -12px #0ea5e9;">📣 قناة التبليغات</a>
                        <button class="btn" onclick="shareApp()">📤 شارك المنصة مع زملائك</button>
                        ${isStandalone() ? '' : `<button class="btn" style="background: linear-gradient(135deg,#8b5cf6,#6d28d9); box-shadow: 0 10px 22px -12px #8b5cf6;" onclick="installApp()">📲 تحميل التطبيق</button>`}
                    </div>

                    <div class="emails">
                        ${[['احمد', 'ahmedh.almajidy@uokufa.edu.iq'], ['اسعد', 'asaad.alshareefi@uokufa.edu.iq']].map(([n, e]) => `
